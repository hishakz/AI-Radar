<!DOCTYPE html>
<html lang="en" dir="ltr" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Radar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f0f0e;--ink2:#3a3a36;--ink3:#7a7a72;--ink4:#b8b8b0;
  --paper:#f6f4ef;--paper2:#eeecea;--paper3:#e4e2d8;
  --teal:#1a7f6e;--teal-lt:#d4f0ea;
  --amber:#c47a1a;--amber-lt:#fdf0d4;
  --red:#c0392b;--red-lt:#fde8e6;
  --blue:#1a5fa8;--blue-lt:#deeaf7;
  --green:#2a6b3c;--green-lt:#dff2e5;
  --purple:#6c3fa8;--purple-lt:#ede8f8;
  --line:rgba(0,0,0,.1);--radius:10px;
}
@media(prefers-color-scheme:dark){
  :root{
    --ink:#f0eeea;--ink2:#c8c6be;--ink3:#8a8a82;--ink4:#5a5a52;
    --paper:#141412;--paper2:#1e1e1a;--paper3:#282824;
    --teal:#2aad93;--teal-lt:#0a2e28;--amber:#e09030;--amber-lt:#2e1e04;
    --red:#e05545;--red-lt:#2e0e0a;--blue:#4a8fd0;--blue-lt:#0a1e32;
    --green:#4a9b62;--green-lt:#0a2016;--purple:#a07de0;--purple-lt:#1e1230;
    --line:rgba(255,255,255,.1);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
[dir="rtl"] body,[dir="rtl"]{font-family:'Cairo',sans-serif}

/* HEADER */
.hd{background:var(--ink);color:var(--paper);padding:16px 24px;position:sticky;top:0;z-index:200;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.wm{font-family:'DM Serif Display',serif;font-size:20px;letter-spacing:-.4px;line-height:1}
[dir="rtl"] .wm{font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;letter-spacing:0}
.wm span{color:var(--teal)}
.tl{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.1em;color:var(--ink4);margin-top:2px;text-transform:uppercase}
[dir="rtl"] .tl{font-family:'Cairo',sans-serif;font-size:10px;letter-spacing:0;text-transform:none}
.hd-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.hbadge{font-size:9px;font-family:'DM Mono',monospace;padding:3px 9px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:var(--ink4)}
[dir="rtl"] .hbadge{font-family:'Cairo',sans-serif;font-size:10px}
.hbadge.live{border-color:var(--teal);color:var(--teal);display:flex;align-items:center;gap:5px}
.pulse{width:6px;height:6px;background:var(--teal);border-radius:50%;animation:pl 2s infinite;flex-shrink:0}
@keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.lang-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.lang-btn{font-size:10px;font-weight:600;padding:4px 12px;cursor:pointer;background:transparent;border:none;color:var(--ink4);font-family:'DM Mono',monospace}
.lang-btn.active{background:var(--teal);color:#fff}

/* NAV */
.nav{background:var(--paper3);border-bottom:1px solid var(--line);padding:0 24px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:60px;z-index:190}
.nav-tab{font-size:10px;font-family:'DM Mono',monospace;font-weight:500;padding:12px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--ink3);border:none;background:none;display:flex;align-items:center;gap:5px;letter-spacing:.05em;text-transform:uppercase;transition:all .15s}
[dir="rtl"] .nav-tab{font-family:'Cairo',sans-serif;font-size:11px;letter-spacing:0;text-transform:none;font-weight:700}
.nav-tab.active,.nav-tab:hover{color:var(--ink);border-bottom-color:var(--teal)}
.nav-tab .cnt{font-size:8px;background:var(--paper);padding:1px 5px;border-radius:10px;color:var(--ink3)}
.nav-tab.active .cnt{background:var(--teal);color:#fff}

/* DOMAIN FILTER BAR */
.dfbar{background:var(--paper2);border-bottom:1px solid var(--line);padding:8px 24px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;position:sticky;top:106px;z-index:180}
.dfbar-label{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;margin-right:4px}
[dir="rtl"] .dfbar-label{font-family:'Cairo',sans-serif;letter-spacing:0;text-transform:none;font-size:10px;font-weight:700;margin-right:0;margin-left:4px}
.dfbtn{font-size:9px;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:20px;border:.5px solid var(--line);background:transparent;color:var(--ink3);cursor:pointer;white-space:nowrap;transition:all .15s}
[dir="rtl"] .dfbtn{font-family:'Cairo',sans-serif;font-size:10px;font-weight:600;letter-spacing:0}
.dfbtn:hover,.dfbtn.active{color:var(--ink);border-color:var(--teal);background:var(--teal-lt)}
.dfbtn.active{font-weight:700;background:var(--teal);color:#fff;border-color:var(--teal)}
.df-count{font-size:8px;margin-inline-start:3px;opacity:.8}

/* LAYOUT */
.body{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 150px)}
@media(max-width:860px){.body{grid-template-columns:1fr}}
.main{padding:20px 24px;border-right:1px solid var(--line)}
[dir="rtl"] .main{border-right:none;border-left:1px solid var(--line)}
.sidebar{padding:18px;background:var(--paper2)}

/* SECTION */
.sec-hd{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sec-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sec-title{font-family:'DM Serif Display',serif;font-size:18px;line-height:1.2}
[dir="rtl"] .sec-title{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px}
.sec-sub{font-size:10px;color:var(--ink3);margin-top:1px}
[dir="rtl"] .sec-sub{font-size:11px}
.sec-div{height:1px;background:var(--line);margin:20px 0}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.stat{background:var(--paper);padding:10px 12px;text-align:center}
.stat-n{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);line-height:1}
[dir="rtl"] .stat-n{font-family:'Cairo',sans-serif;font-weight:900;font-size:19px}
.stat-l{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
[dir="rtl"] .stat-l{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}

/* CARDS */
.grid{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:6px}
.card{background:var(--paper);border:.5px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--teal);box-shadow:0 2px 12px rgba(0,0,0,.07)}
.card.p1{border-inline-start:3px solid var(--teal)}
.card.p2{border-inline-start:3px solid var(--amber)}
.card.p3{border-inline-start:3px solid var(--blue)}
.card.pnew{border-inline-start:3px solid #378ADD}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.bdg{font-size:8px;font-family:'DM Mono',monospace;font-weight:500;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
[dir="rtl"] .bdg{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}
.bdg-teal{background:var(--teal-lt);color:var(--teal)}.bdg-amber{background:var(--amber-lt);color:var(--amber)}
.bdg-red{background:var(--red-lt);color:var(--red)}.bdg-blue{background:var(--blue-lt);color:var(--blue)}
.bdg-green{background:var(--green-lt);color:var(--green)}.bdg-gray{background:var(--paper3);color:var(--ink3)}
.bdg-purple{background:var(--purple-lt);color:var(--purple)}
/* domain tag pills on card */
.card-domains{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.dtag{font-size:8px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:3px;cursor:pointer;transition:all .12s;border:.5px solid var(--line);color:var(--ink3);background:var(--paper2)}
[dir="rtl"] .dtag{font-family:'Cairo',sans-serif;font-size:9px;letter-spacing:0}
.dtag:hover,.dtag.active-domain{background:var(--teal);color:#fff;border-color:var(--teal)}
.card-title{font-size:12.5px;font-weight:600;line-height:1.45;color:var(--ink);margin-bottom:3px}
[dir="rtl"] .card-title{font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;line-height:1.5}
.card-org{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink3);margin-bottom:5px}
[dir="rtl"] .card-org{font-family:'Cairo',sans-serif;font-size:10px}
.card-body{font-size:11px;line-height:1.65;color:var(--ink2);flex:1}
[dir="rtl"] .card-body{font-family:'Cairo',sans-serif;font-size:12px;line-height:1.8}

/* INNOVATION BOX */
.inno{background:var(--teal-lt);border:1px solid var(--teal);border-radius:7px;padding:10px 12px;margin-top:8px}
.inno-lbl{font-size:8px;font-family:'DM Mono',monospace;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:4px;display:flex;align-items:center;gap:4px}
[dir="rtl"] .inno-lbl{font-family:'Cairo',sans-serif;font-size:10px;text-transform:none;letter-spacing:0;font-weight:700}
.inno-lbl::before{content:'';width:5px;height:5px;background:var(--teal);border-radius:50%;flex-shrink:0}
.inno-txt{font-size:11px;line-height:1.6;color:var(--ink2)}
[dir="rtl"] .inno-txt{font-family:'Cairo',sans-serif;font-size:12px;line-height:1.75}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.tag{font-size:8px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:3px;background:rgba(26,127,110,.1);color:var(--teal)}
[dir="rtl"] .tag{font-family:'Cairo',sans-serif;font-size:9px;font-weight:600}

/* FEASIBILITY */
.fmat{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fmat-hd{background:var(--paper3);padding:7px 12px;display:flex;align-items:center;justify-content:space-between}
[dir="rtl"] .fmat-hd{flex-direction:row-reverse}
.fmat-lbl{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
[dir="rtl"] .fmat-lbl{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}
.verdict{font-size:9px;font-family:'DM Mono',monospace;font-weight:700;padding:3px 9px;border-radius:4px}
[dir="rtl"] .verdict{font-family:'Cairo',sans-serif;font-size:10px}
.v-go{background:#2a6b3c;color:#fff}.v-pilot{background:#c47a1a;color:#fff}
.v-plan{background:#1a5fa8;color:#fff}.v-long{background:#5a5a72;color:#fff}
.frows{padding:8px 12px;display:grid;gap:5px}
.frow{display:grid;grid-template-columns:120px 1fr 70px;align-items:center;gap:8px}
[dir="rtl"] .frow{grid-template-columns:70px 1fr 120px;direction:rtl}
.frow-lbl{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink3)}
[dir="rtl"] .frow-lbl{font-family:'Cairo',sans-serif;font-size:10px;font-weight:600;text-align:right;color:var(--ink2)}
.fbar{height:5px;background:var(--paper3);border-radius:3px;overflow:hidden}
.fbar-fill{height:100%;border-radius:3px}
.f1{width:20%;background:var(--green)}.f2{width:40%;background:#6ab04c}
.f3{width:60%;background:var(--amber)}.f4{width:80%;background:#e07020}.f5{width:100%;background:var(--red)}
.frow-val{font-size:9px;font-family:'DM Mono',monospace;font-weight:600;text-align:right;color:var(--ink2)}
[dir="rtl"] .frow-val{font-family:'Cairo',sans-serif;font-size:10px;font-weight:700}
.fmat-ft{background:var(--paper2);padding:7px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fft{font-size:10px;line-height:1.55;color:var(--ink2)}
[dir="rtl"] .fft{font-family:'Cairo',sans-serif;font-size:11px;line-height:1.65}
.fft strong{font-size:8px;font-family:'DM Mono',monospace;display:block;color:var(--ink3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em}
[dir="rtl"] .fft strong{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}

/* CARD FOOTER */
.cft{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
[dir="rtl"] .cft{flex-direction:row-reverse}
.cft-date{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink4)}
[dir="rtl"] .cft-date{font-family:'Cairo',sans-serif;font-size:9px}
.cft-link{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:3px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cft-link:hover{color:var(--teal)}
[dir="rtl"] .cft-link{font-family:'Cairo',sans-serif;font-size:9px}

/* DECISION TABLE */
.dtable{width:100%;border-collapse:collapse;font-size:10px}
.dtable th{padding:8px 6px;text-align:center;font-size:8px;font-family:'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line);background:var(--paper3);font-weight:500}
[dir="rtl"] .dtable th{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}
.dtable th:first-child{text-align:left;padding-inline-start:12px}
.dtable td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);color:var(--ink2)}
.dtable td:first-child{text-align:left;padding-inline-start:12px;font-size:10px;font-weight:600;color:var(--ink)}
[dir="rtl"] .dtable td:first-child{font-family:'Cairo',sans-serif;font-size:11px}
.dtable tr:last-child td{border-bottom:none}

/* LEGEND BAR */
.lgd{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:8px 12px;background:var(--paper2);border-radius:8px;border:.5px solid var(--line)}

/* SIDEBAR */
.sb-sec{margin-bottom:20px}
.sb-title{font-size:8px;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
[dir="rtl"] .sb-title{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}
.mini{padding:8px 10px;border-radius:7px;background:var(--paper);border:.5px solid var(--line);margin-bottom:5px}
.mini-t{font-size:11px;font-weight:500;color:var(--ink);line-height:1.4;margin-bottom:2px}
[dir="rtl"] .mini-t{font-family:'Cairo',sans-serif;font-size:11px;font-weight:700}
.mini-m{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink3);display:flex;align-items:center;gap:5px}
[dir="rtl"] .mini-m{font-family:'Cairo',sans-serif;font-size:9px;flex-direction:row-reverse;justify-content:flex-end}
.mini-bdg{font-size:8px;padding:1px 5px;border-radius:3px;font-family:'DM Mono',monospace}
[dir="rtl"] .mini-bdg{font-family:'Cairo',sans-serif;font-size:8px;font-weight:600}
.rm-item{padding-inline-start:12px;border-inline-start:2px solid;margin-bottom:9px}
.rm-item h4{font-size:11px;font-weight:600}
.sb-src-link{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink3);text-decoration:none;margin-inline-start:6px;white-space:nowrap}
.sb-src-link:hover{color:var(--teal)}
[dir="rtl"] .sb-src-link{font-family:'Cairo',sans-serif}
[dir="rtl"] .rm-item h4{font-family:'Cairo',sans-serif;font-size:12px}
.rm-item p{font-size:10px;line-height:1.6;color:var(--ink2);margin-top:2px}
[dir="rtl"] .rm-item p{font-family:'Cairo',sans-serif;font-size:11px;line-height:1.7}

/* EMPTY STATE */
.empty-state{padding:40px 24px;text-align:center;color:var(--ink3);font-size:13px}
.empty-state span{font-size:32px;display:block;margin-bottom:10px}

/* PANEL */
.panel{display:none}.panel.active{display:block}

/* ── INVESTMENT PANEL ── */
.inv-fab{position:fixed;bottom:28px;right:28px;z-index:500;background:var(--ink);color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .2s,box-shadow .2s;font-family:'DM Sans',sans-serif}
[dir="rtl"] .inv-fab{right:auto;left:28px;font-family:'Cairo',sans-serif}
.inv-fab:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,0,0,.35)}
.inv-fab .pulse-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:pl 2s infinite;flex-shrink:0}
.inv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;opacity:0;pointer-events:none;transition:opacity .3s}
.inv-overlay.open{opacity:1;pointer-events:all}
.inv-drawer{position:fixed;top:0;right:-520px;width:500px;max-width:95vw;height:100vh;background:var(--paper);z-index:700;overflow-y:auto;transition:right .35s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 32px rgba(0,0,0,.2);display:flex;flex-direction:column}
[dir="rtl"] .inv-drawer{right:auto;left:-520px;transition:left .35s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 32px rgba(0,0,0,.2)}
.inv-drawer.open{right:0}
[dir="rtl"] .inv-drawer.open{left:0;right:auto}
.inv-header{background:var(--ink);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
[dir="rtl"] .inv-header{flex-direction:row-reverse}
.inv-header h2{font-family:'DM Serif Display',serif;font-size:18px;letter-spacing:-.3px}
[dir="rtl"] .inv-header h2{font-family:'Cairo',sans-serif;font-weight:900;font-size:17px}
.inv-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.inv-body{padding:18px 20px;flex:1}
.inv-disclaimer{margin:0 20px 14px;padding:9px 12px;background:var(--amber-lt);border:1px solid var(--amber);border-radius:7px;font-size:10px;font-family:'DM Mono',monospace;color:var(--amber);line-height:1.5}
[dir="rtl"] .inv-disclaimer{font-family:'Cairo',sans-serif;font-size:11px}
.inv-sec-title{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:10px}
[dir="rtl"] .inv-sec-title{font-family:'Cairo',sans-serif;font-size:10px;text-transform:none;letter-spacing:0;font-weight:700}
.inv-block{margin-bottom:22px}
/* Stock rows */
.stock-row{display:grid;grid-template-columns:70px 1fr 80px 90px;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--paper2);margin-bottom:5px;border:.5px solid var(--line)}
[dir="rtl"] .stock-row{direction:rtl}
.stock-ticker{font-family:'DM Mono',monospace;font-weight:700;font-size:12px;color:var(--ink)}
.stock-name{font-size:11px;color:var(--ink2);line-height:1.3}
[dir="rtl"] .stock-name{font-family:'Cairo',sans-serif;font-size:12px}
.stock-signal{font-size:9px;font-family:'DM Mono',monospace;font-weight:700;padding:2px 8px;border-radius:4px;text-align:center;white-space:nowrap}
[dir="rtl"] .stock-signal{font-family:'Cairo',sans-serif;font-size:10px}
.sig-buy{background:#dff2e5;color:#2a6b3c}
.sig-watch{background:#fdf0d4;color:#c47a1a}
.sig-caution{background:#fde8e6;color:#c0392b}
.sig-ipo{background:#ede8f8;color:#6c3fa8}
.stock-why{font-size:9px;color:var(--ink3);line-height:1.4}
[dir="rtl"] .stock-why{font-family:'Cairo',sans-serif;font-size:10px}
/* Opportunity cards */
.opp-card{border-radius:9px;border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;background:var(--paper)}
.opp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
[dir="rtl"] .opp-top{flex-direction:row-reverse}

   ar:{badges:[['teal','تفتيش']],title:'17 مدينة أمريكية: كاميرات ذكاء اصطناعي على شاحنات القمامة لمسح انتهاكات البناء أسبوعياً',org:'City Detect · الولايات المتحدة',
    body:'City Detect نشرت كاميرات ذكاء اصطناعي على شاحنات القمامة في 17 مدينة أمريكية، تعالج آلاف الملاحظات أسبوعياً مقارنةً بنحو 50 للمفتش البشري. أول اختبار ضغط حقيقي: موسم الأعاصير 2026.',
    inno:'نموذج "الأسطول المُدمج" هو نقطة الدخول الأدنى تكلفة. لا موظفون جدد، لا مسارات جديدة، لا بنية تحتية جديدة.',
    tags:['تفتيش سلبي على الأسطول','تطبيق القواعد','تفتيش الإسكان','لا موظفين جدد'],date:'مارس 2026'}},

  {sec:'city',p:'p3',domains:['smart-city','construction'],
   url:'https://www.bpcmag.com/blog/how-smart-infrastructure-is-reshaping-modern-cities/',
   en:{badges:[['teal','Inspect']],title:'Structural health monitoring: continuous AI sensors in bridges, tunnels and urban infrastructure replace periodic manual inspection',org:'Smart Infrastructure Industry · Global',
    body:'Structural health monitoring systems embedded in bridges, tunnels, and aging urban infrastructure continuously assess asset conditions. Sensor costs have fallen by orders of magnitude, making broad deployment economically viable across entire road and bridge networks. Connected cities see measurable improvements in maintenance cost and safety outcomes.',
    inno:'Continuous structural monitoring reframes inspection from "go check" to "receive alert when threshold breached." Embed low-cost sensors now and have assets self-report their condition. The inspector visits only when the sensor signals a problem — this is the inspection digital twin for physical infrastructure.',
    tags:['structural health monitoring','IoT sensors','threshold-based inspection','infrastructure self-reporting'],date:'Ongoing 2026'},
   ar:{badges:[['teal','تفتيش']],title:'مراقبة الصحة الهيكلية: مستشعرات ذكاء اصطناعي مستمرة في الجسور والأنفاق تحل محل التفتيش الدوري',org:'قطاع البنية التحتية الذكية · عالمي',
    body:'أنظمة مراقبة الصحة الهيكلية المدمجة في الجسور والأنفاق والبنية التحتية الحضرية تُقيّم حالة الأصول باستمرار. انخفضت تكاليف المستشعرات بشكل كبير مما يجعل النشر الواسع مجدياً اقتصادياً.',
    inno:'تُعيد المراقبة الهيكلية المستمرة تعريف التفتيش من "اذهب وتحقق" إلى "تلقّ تنبيهاً عند تجاوز العتبة". أدمج مستشعرات منخفضة التكلفة واجعل الأصل يُبلّغ عن حالته ذاتياً.',
    tags:['مراقبة الصحة الهيكلية','مستشعرات إنترنت الأشياء','التفتيش المبني على العتبة','تقرير ذاتي'],date:'مستمر 2026'}},

  {sec:'food',p:'pnew',domains:['food','policy'],
   url:'https://www.food-safety.com/articles/11322-fda-launches-bridge-project-to-modernize-food-facility-inspections',
   en:{badges:[['teal','NEW'],['green','Food Safety'],['teal','Inspect']],title:'FDA BRIDGE Project: risk-based AI approach to modernise ALL domestic food facility inspections by 2027',org:'US FDA / Human Foods Program · USA',
    body:'The FDA launched the Better Regulatory Inspections for Dynamic Government Efficiency (BRIDGE) Project — a formal programme to move domestic food facility inspection away from fixed schedules toward data-driven, risk-based approaches. In partnership with state co-regulators, BRIDGE applies AI analytics to optimise inspection frequency, reduce duplication across agencies, and improve coverage. Phase 1 (Jun–Sep 2025): planning. Phase 2 (Oct 2025–Dec 2027): live proof-of-process testing with selected state partners.',
    inno:'BRIDGE is the US government\'s official pivot to the inspection model your domain already advocates: risk-based dispatch, not calendar-based coverage. For your innovation programme, this is the regulatory signal that changes the conversation from "experimental" to "where the whole sector is heading." Saudi Arabia and other regulators can follow this framework to redesign their own inspection programmes with federal-grade credibility.',
    tags:['FDA risk-based inspection','BRIDGE project','federal AI inspection','state partnership'],date:'Apr 28, 2026'},
   ar:{badges:[['teal','جديد'],['green','سلامة غذائية'],['teal','تفتيش']],title:'مشروع BRIDGE من FDA: نهج ذكاء اصطناعي قائم على المخاطر لتحديث جميع عمليات تفتيش المنشآت الغذائية الأمريكية بحلول 2027',org:'FDA الأمريكية / برنامج الأغذية البشرية · الولايات المتحدة',
    body:'أطلقت FDA مشروع BRIDGE — برنامج رسمي للتحول من جداول تفتيش المنشآت الغذائية الثابتة نحو نهج مدفوع بالبيانات ومبني على المخاطر. بالشراكة مع الجهات التنظيمية الولائية، يطبّق BRIDGE تحليلات الذكاء الاصطناعي لتحسين تكرار التفتيش، وتقليل التكرار بين الجهات، وتحسين التغطية. المرحلة 1 (يونيو–سبتمبر 2025): التخطيط. المرحلة 2 (أكتوبر 2025–ديسمبر 2027): اختبار حي للعمليات.',
    inno:'BRIDGE هو التحول الرسمي للحكومة الأمريكية نحو نموذج التفتيش الذي يدعو إليه مجالك: الإيفاد القائم على المخاطر، لا التغطية التقويمية. لبرنامج الابتكار الخاص بك، هذه هي الإشارة التنظيمية التي تُحوّل النقاش من "تجريبي" إلى "الاتجاه الذي يسير نحوه القطاع بأكمله".',
    tags:['تفتيش FDA القائم على المخاطر','مشروع BRIDGE','تفتيش فيدرالي بالذكاء الاصطناعي','الشراكة مع الولايات'],date:'28 أبريل 2026'}},

  {sec:'construction',p:'pnew',domains:['construction'],
   url:'https://www.constructionequipment.com/technology/article/55373232/construction-equipment-safety-tech-ai-cameras-e-stops-and-smart-machines',
   en:{badges:[['teal','NEW'],['amber','Construction'],['teal','Inspect']],title:'Conexpo 2026: AI cameras auto-stop excavators within 6 feet of workers — safety from passive checklist to active AI partner',org:'Construction Equipment Industry · Conexpo-Con/Agg 2026 · USA',
    body:'At Conexpo-Con/Agg 2026 (industry\'s largest trade show), live demonstrations showed AI safety systems stopping a working excavator automatically when a person entered within 6 feet. Smart Around View Monitor (SAVM) systems with 6 high-resolution cameras and radar sensors provide 360-degree real-time awareness. Human Detection Systems flag proximity hazards before accidents occur. AI is moving construction safety from "passive checklist after the fact" to "active intelligent partner that stops the machine before harm."',
    inno:'This is exactly the technology needed to modernise excavation and construction site inspection. Instead of an inspector walking a hazardous site to observe safety conditions, AI cameras on every machine continuously monitor the entire site — and physically stop equipment when unsafe conditions are detected. For your inspection domain: mandate AI proximity detection as a site safety certification requirement, not just a voluntary technology adoption.',
    tags:['AI excavator safety','proximity detection','auto-stop','active construction inspection'],date:'Apr 2026 Conexpo'},
   ar:{badges:[['teal','جديد'],['amber','بناء'],['teal','تفتيش']],title:'Conexpo 2026: كاميرات ذكاء اصطناعي توقف الحفارات تلقائياً في نطاق 6 أقدام من العمال',org:'قطاع معدات البناء · Conexpo-Con/Agg 2026 · الولايات المتحدة',
    body:'في Conexpo-Con/Agg 2026 (أكبر معرض صناعي)، أظهرت تجارب حية أنظمة سلامة بالذكاء الاصطناعي توقف حفارة نشطة تلقائياً عند اقتراب شخص في نطاق 6 أقدام. أنظمة SAVM مع 6 كاميرات عالية الدقة ومستشعرات رادارية توفر رؤية 360 درجة في الوقت الفعلي. الذكاء الاصطناعي يتحول في سلامة البناء من "قائمة مراجعة سلبية بعد الحدث" إلى "شريك ذكي نشط يوقف الآلة قبل وقوع الضرر".',
    inno:'هذه هي التقنية المطلوبة بالضبط لتحديث تفتيش مواقع الحفر والبناء. بدلاً من مفتش يجوب موقعاً خطراً لمراقبة ظروف السلامة، تراقب كاميرات الذكاء الاصطناعي الموقع بأكمله باستمرار وتوقف المعدات فعلياً عند اكتشاف ظروف غير آمنة. لمجالك: اشترط كشف القرب بالذكاء الاصطناعي كمتطلب شهادة سلامة الموقع.',
    tags:['سلامة الحفارات بالذكاء الاصطناعي','كشف القرب','إيقاف تلقائي','تفتيش بناء نشط'],date:'أبريل 2026 Conexpo'}},

  {sec:'construction',p:'p1',domains:['construction'],
   url:'https://news.vt.edu/articles/2026/03/eng-mlsoc-robots-and-ai-tackling-construction-challenges-mario.html',
   en:{badges:[['amber','Construction'],['teal','Inspect']],title:'MARIO: multi-robot AI for continuous construction inspection — 1 operator supervises multiple sites simultaneously',org:'Virginia Tech / Procon Consulting · USA',
    body:'Coordinated ground robots and drones with AI sensing and computer vision for continuous real-time construction monitoring. One remote inspector supervises multiple robots across multiple sites. Identifies defects, sequencing problems, and coordination issues early. Robots enter hazardous areas instead of human inspectors, addressing both the inspector shortage and safety risk.',
    inno:'MARIO solves two core innovation challenges simultaneously: inspector shortage (one expert covers multiple sites) and inspector safety (robots enter hazardous zones). For excavation inspection specifically, this transforms a high-risk, high-travel role into a remote monitoring function. Saudi Arabia\'s construction boom makes this immediately relevant.',
    tags:['multi-site supervision','excavation inspection','inspector shortage solution','hazardous environments'],date:'Mar 2026'},
   ar:{badges:[['amber','بناء'],['teal','تفتيش']],title:'MARIO: نظام الروبوت متعدد العوامل للمراقبة المستمرة لمواقع البناء — مشغّل واحد لمواقع متعددة',org:'Virginia Tech / Procon · الولايات المتحدة',
    body:'فرق منسقة من الروبوتات الأرضية والطائرات المسيّرة مع الاستشعار بالذكاء الاصطناعي والرؤية الحاسوبية للمراقبة الميدانية في الوقت الفعلي. مفتش واحد عن بُعد يشرف على روبوتات متعددة عبر مواقع متعددة. الروبوتات تدخل المناطق الخطرة بدلاً من المفتشين البشريين.',
    inno:'يحل MARIO تحديَي الابتكار الجوهريَّين معاً: نقص المفتشين وسلامتهم. الطفرة العمرانية في المملكة العربية السعودية تجعل هذا ذا صلة فورية.',
    tags:['إشراف متعدد المواقع','تفتيش الحفريات','حل نقص المفتشين','البيئات الخطرة'],date:'مارس 2026'}},

  {sec:'construction',p:'p2',domains:['construction'],
   url:'https://candrone.com/blogs/news/flying-blind-the-new-era-of-underground-inspections-with-drone-based-slam-lidar',
   en:{badges:[['amber','Excavation'],['teal','Inspect']],title:'SLAM-LiDAR drones map GPS-denied underground excavations autonomously — gas detection, digital twin generation',org:'Exyn Technologies / Hovermap · Global',
    body:'SLAM-based LiDAR drones map tunnels, stopes, and mine shafts in GPS-denied underground environments. Mount Isa Mines: stope surveys from 4 hours to minutes. Detects methane/CO gas pockets, unstable terrain, ground support degradation. Full digital twin generated from drone data — no human entry required into hazardous zones.',
    inno:'Apply to utility trench inspection, basement inspection, and deep excavation safety checks — all scenarios where current methods put inspectors at risk. Mandate AI-based subsurface mapping as a formal pre-construction inspection deliverable.',
    tags:['GPS-denied mapping','excavation safety','gas detection','digital twin generation'],date:'Ongoing 2026'},
   ar:{badges:[['amber','حفريات'],['teal','تفتيش']],title:'طائرات SLAM-LiDAR ترسم خرائط الحفريات الجوفية بدون GPS — كشف الغاز وتوليد التوأم الرقمي',org:'Exyn Technologies / Hovermap · عالمي',
    body:'طائرات LiDAR مسيّرة مبنية على SLAM ترسم خرائط الأنفاق والحفريات الجوفية في بيئات محرومة من GPS. اكتشاف جيوب الغاز (الميثان وأول أكسيد الكربون) والتربة غير المستقرة. توليد توأم رقمي كامل دون حاجة للدخول البشري.',
    inno:'طبّق على تفتيش خنادق المرافق والطوابق السفلية والحفر العميق. فرض رسم الخرائط الجوفية بالذكاء الاصطناعي كمتطلب تفتيش ما قبل البناء.',
    tags:['رسم خرائط بدون GPS','سلامة الحفريات','كشف الغاز','توليد التوأم الرقمي'],date:'مستمر 2026'}},

  {sec:'construction',p:'p3',domains:['construction'],
   url:'https://www.dslrpros.com/blogs/drone-trends/drone-infrastructure-inspection-for-bridges-roads-and-buildings',
   en:{badges:[['amber','Infrastructure'],['teal','Inspect']],title:'Drone bridge inspection: $250 vs $4,600 traditional — 94% cost reduction benchmark (Michigan DOT)',org:'Michigan DOT / Union Pacific · USA',
    body:'Michigan DOT analysis: drone-assisted bridge inspection costs $250 vs $4,600 traditional — $4,350 savings per inspection. Union Pacific deploys across 32,000-mile rail network. Construction AI adoption doubled: 38% of contractors now report measurable impact vs 17% a year ago.',
    inno:'The 94% cost reduction is your ROI case for any drone programme. Calculate your jurisdiction\'s annual bridge inspection budget at $4,600 per bridge — then show the same number at $250. The $4,375 per bridge saving funds your entire AI inspection programme.',
    tags:['94% cost reduction','ROI benchmark','drone deployment','infrastructure inspection'],date:'Ongoing 2026'},
   ar:{badges:[['amber','بنية تحتية'],['teal','تفتيش']],title:'تفتيش الجسور بالطائرات المسيّرة: 250 دولاراً مقابل 4,600 — تخفيض 94% (معيار وزارة نقل ميشيغان)',org:'Michigan DOT / Union Pacific · الولايات المتحدة',
    body:'تحليل وزارة النقل: تكلفة التفتيش بالطائرات المسيّرة 250 دولاراً مقابل 4,600 تقليدياً — وفر 4,350 دولاراً لكل عملية. Union Pacific تنشر الطائرات المسيّرة على شبكة سككها البالغة 32,000 ميل.',
    inno:'تخفيض 94% هو حجتك لجدوى الاستثمار. احسب ميزانية تفتيش الجسور السنوية في نطاقك بـ 4,600 دولار للجسر، ثم أظهر الرقم ذاته بـ 250 دولاراً. الوفر يُموّل برنامج التفتيش بالذكاء الاصطناعي بالكامل.',
    tags:['تخفيض 94%','معيار العائد على الاستثمار','نشر الطائرات المسيّرة','تفتيش البنية التحتية'],date:'مستمر 2026'}},

  {sec:'food',p:'p1',domains:['food'],
   url:'https://smartfoodsafe.com/role-of-ai-in-food-safety/',
   en:{badges:[['green','Food Safety'],['teal','Inspect']],title:'AI predictive food safety: risk-based inspection scheduling replaces periodic restaurant visits',org:'USDA-FSIS / SmartFoodSafe · USA',
    body:'AI platforms ingest historical violation data, weather, supply chain events, and seasonal patterns to forecast where food safety problems will occur next. Enables risk-prioritised scheduling instead of routine calendar visits. NLP automates documentation, audit preparation, and compliance reporting. Tyson Foods using computer vision to track individual meat pieces through processing.',
    inno:'The "inspection as analytics" model: rank which restaurants need inspection this week based on violation history, season, event density, supply chain signals. Same headcount, 4x better targeting of actual violations.',
    tags:['risk-based scheduling','predictive violations','restaurant inspection','NLP compliance'],date:'Ongoing 2026'},
   ar:{badges:[['green','سلامة غذائية'],['teal','تفتيش']],title:'تقييم مخاطر سلامة الغذاء بالذكاء الاصطناعي — الجدولة القائمة على المخاطر تحل محل الزيارات الدورية',org:'USDA-FSIS / SmartFoodSafe · الولايات المتحدة',
    body:'منصات ذكاء اصطناعي تستوعب البيانات التاريخية للمخالفات والطقس وأحداث سلسلة الإمداد للتنبؤ بمكان مشاكل سلامة الغذاء التالية. NLP يُؤتمت التوثيق وإعداد التدقيق.',
    inno:'نموذج "التفتيش كتحليلات": يصنّف المطاعم الأعلى خطورة هذا الأسبوع. نفس عدد المفتشين مع استهداف أفضل بـ 4 أضعاف للمخاطر الفعلية.',
    tags:['الجدولة القائمة على المخاطر','توقع المخالفات','تفتيش المطاعم','امتثال NLP'],date:'مستمر 2026'}},

  {sec:'food',p:'p2',domains:['food'],
   url:'https://ifactoryapp.com/industries/food-manufacturing/ai-computer-vision-food-quality-inspection-detecting-defects',
   en:{badges:[['green','Food Safety'],['teal','Inspect']],title:'AI computer vision food inspection: 99% accuracy at production speed — FSMA 204 full compliance',org:'Averroes AI / Industry · USA',
    body:'Deep learning + high-res cameras detect contamination, foreign objects (glass, metal, plastic), colour anomalies in under 10ms per frame. X-ray + hyperspectral + NIR imaging combined. Every unit inspected, not sampled. Pneumatic rejection triggered in real time with full traceability logging for FSMA 204 compliance.',
    inno:'99% accuracy at 10ms makes AI food inspection commercially viable at scale. For inspection authorities: your role shifts from "inspect the product" to "certify the AI inspection system" — requiring new accreditation frameworks. Policy innovation as much as technical innovation.',
    tags:['AI system accreditation','food safety automation','100% product coverage','regulatory framework'],date:'Ongoing 2026'},
   ar:{badges:[['green','سلامة غذائية'],['teal','تفتيش']],title:'فحص الغذاء بالرؤية الحاسوبية: دقة 99% بسرعة الإنتاج — متوافق بالكامل مع FSMA 204',org:'Averroes AI / Industry · الولايات المتحدة',
    body:'التعلم العميق وكاميرات عالية الدقة ترصد التلوث والأجسام الغريبة (الزجاج والمعادن والبلاستيك) في أقل من 10 ملي ثانية. كل وحدة مفحوصة — لا عينات فحسب. رفض تلقائي فوري مع تسجيل كامل.',
    inno:'دقة 99% عند 10 ملي ثانية تجعل التفتيش مجدياً تجارياً. لسلطات التفتيش: دورك ينتقل من "تفتيش المنتج" إلى "اعتماد نظام التفتيش" — مما يستلزم أطر اعتماد جديدة.',
    tags:['اعتماد نظام الذكاء الاصطناعي','أتمتة سلامة الغذاء','تغطية 100%','إطار تنظيمي'],date:'مستمر 2026'}},

  {sec:'housing',p:'pnew',domains:['housing','smart-city'],
   url:'https://press.siemens.com/global/en/pressrelease/siemens-showcases-journey-smart-autonomous-buildings-light-building-2026',
   en:{badges:[['teal','NEW'],['blue','Buildings']],title:'Siemens at Light+Building 2026: smart → autonomous buildings — AI manages energy, safety and maintenance continuously',org:'Siemens · Germany',
    body:'Siemens demonstrated Industrial AI transforming buildings from smart to human-centric autonomous infrastructure at Light+Building Frankfurt. AI enables adaptive energy management, safety monitoring, and predictive maintenance without constant human oversight. Addresses workforce challenges, outdated planning, and building emissions compliance simultaneously.',
    inno:'Autonomous buildings are self-inspecting buildings. When a building\'s AI detects a deviation from safety norms, it flags it and logs it for the inspection authority. Your domain evolution: inspection authorities shift from "go inspect" to "receive building self-report and verify." The most transformational shift in the inspection authority\'s role — from field operator to standards certifier.',
    tags:['self-inspecting buildings','autonomous monitoring','predictive maintenance','inspection authority evolution'],date:'Mar 2026 (announced Apr 16)'},
   ar:{badges:[['teal','جديد'],['blue','مباني']],title:'سيمنز في Light+Building 2026: المباني الذكية إلى المستقلة — الذكاء الاصطناعي يدير الطاقة والسلامة باستمرار',org:'سيمنز · ألمانيا',
    body:'أظهرت سيمنز الذكاء الاصطناعي الصناعي يُحوّل المباني من ذكية إلى بنية تحتية مستقلة تتمحور حول الإنسان. إدارة الطاقة التكيفية ومراقبة السلامة والصيانة التنبؤية دون إشراف بشري مستمر.',
    inno:'المباني المستقلة هي مباني تفتش نفسها. دورك ينتقل من "اذهب وافحص" إلى "استقبل تقرير المبنى الذاتي وتحقق منه". أعمق تحوّل في دور سلطة التفتيش: من مشغّل ميداني إلى مُصادق على المعايير.',
    tags:['المباني التفتيشية الذاتية','المراقبة المستقلة','الصيانة التنبؤية','تطور سلطة التفتيش'],date:'مارس 2026 (أُعلن 16 أبريل)'}},

  {sec:'housing',p:'p2',domains:['housing','smart-city'],
   url:'https://engineering.nyu.edu/news/pushing-envelope-building-inspections-ai-and-robotics',
   en:{badges:[['blue','Buildings'],['teal','Inspect']],title:'NYU + NYC: autonomous robots and thermal drones inspect building envelopes — $1M NSF award, NYC Smart City Testbed',org:'NYU Tandon / NYC OTI · USA',
    body:'$1M NSF CIVIC award for autonomous robot + thermal drone system inspecting building envelopes for moisture, thermal irregularities, and structural defects using GPR + LiDAR + thermal cameras. AI generates detailed condition reports without physical visits. Startup Building Diagnostic Robotics is commercialising the technology.',
    inno:'Directly applicable to group housing inspection: dense residential buildings externally scanned by drones in a fraction of manual inspection time. Thermal imaging finds moisture and insulation failures invisible to human inspectors. For 100+ unit complexes, this is the only path to 100% coverage within budget.',
    tags:['group housing inspection','thermal drone scanning','100% coverage','emissions compliance'],date:'Ongoing'},

const FILL_COLORS=['var(--green)','#6ab04c','var(--amber)','#e07020','var(--red)'];
const FILL_WIDTHS=[20,40,60,80,100];

// Date parsing — fully dynamic, year-agnostic, works in 2026, 2027, 2028+
function parseDateNum(d){
  if(!d) return 0;
  const s=d.toLowerCase().replace(/ auto$/,'').replace(/ تلقائي$/,'').trim();

  // Helper: convert a JS Date to sortable YYYYMMDD integer
  const toN = dt => dt.getFullYear()*10000 + (dt.getMonth()+1)*100 + dt.getDate();
  const now  = new Date();
  const ago  = n => { const x=new Date(now); x.setDate(x.getDate()-n); return toN(x); };
  const wAgo = n => ago(n*7);
  const mAgo = n => { const x=new Date(now); x.setMonth(x.getMonth()-n); return toN(x); };

  // ── Full named-date: "May 31, 2026" / "31 May 2026" / "June 1, 2027" ──
  const EN_MONTHS = {january:1,february:2,march:3,april:4,may:5,june:6,
                     july:7,august:8,september:9,october:10,november:11,december:12};
  // "Month DD, YYYY" or "Month DD YYYY"
  const m1 = s.match(/([a-z]+)\s+(\d{1,2}),?\s+(\d{4})/);
  if(m1 && EN_MONTHS[m1[1]]) return parseInt(m1[3])*10000 + EN_MONTHS[m1[1]]*100 + parseInt(m1[2]);
  // "DD Month YYYY"
  const m2 = s.match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
  if(m2 && EN_MONTHS[m2[2]]) return parseInt(m2[3])*10000 + EN_MONTHS[m2[2]]*100 + parseInt(m2[1]);

  // ── Arabic full date: "31 مايو 2026" ──
  const AR = {يناير:1,فبراير:2,مارس:3,أبريل:4,مايو:5,يونيو:6,
              يوليو:7,أغسطس:8,سبتمبر:9,أكتوبر:10,نوفمبر:11,ديسمبر:12};
  for(const [ar,mn] of Object.entries(AR)){
    if(s.includes(ar)){
      const dy = s.match(/(\d{1,2})/);
      const yr = s.match(/(\d{4})/);
      if(dy && yr) return parseInt(yr[1])*10000 + mn*100 + parseInt(dy[1]);
      if(yr)       return parseInt(yr[1])*10000 + mn*100;
    }
  }

  // ── Partial named month (no year given — assume current or previous year) ──
  const thisYear = now.getFullYear();
  const thisMonth = now.getMonth()+1;
  const EN_ABBR = {jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  // "Apr 17" or "apr 17, 2026 new" style (already caught above if year present)
  for(const [abbr,mn] of Object.entries(EN_ABBR)){
    if(s.startsWith(abbr)||s.includes(' '+abbr)){
      const dy = s.match(/(\d{1,2})/);
      const yr = mn <= thisMonth ? thisYear : thisYear - 1; // don't jump to future
      return yr*10000 + mn*100 + (dy ? parseInt(dy[1]) : 15);
    }
  }
  // May is both a month and a word — handle carefully
  if((s.startsWith('may ')||s.includes(' may ')||s==='may')&&!s.match(/\d{4}/)){
    const dy=s.match(/(\d{1,2})/);
    const yr=5<=thisMonth?thisYear:thisYear-1;
    return yr*10000+5*100+(dy?parseInt(dy[1]):15);
  }

  // ── Relative dates — computed from today ──
  if(s.includes('today')||s.includes('اليوم')||s.includes('now')) return toN(now);
  const dayN = s.match(/(\d+)\s*day/);   if(dayN) return ago(parseInt(dayN[1]));
  const wkN  = s.match(/(\d+)\s*week/);  if(wkN)  return wAgo(parseInt(wkN[1]));
  const moN  = s.match(/(\d+)\s*month/); if(moN)  return mAgo(parseInt(moN[1]));
  // Arabic relative
  if(s.includes('يومان'))                return ago(2);
  if(s.match(/(\d+)\s*أيام/))           return ago(parseInt(s.match(/(\d+)/)[1]));
  if(s.match(/(\d+)\s*أسابيع/))         return wAgo(parseInt(s.match(/(\d+)/)[1]));
  if(s.includes('أسبوع'))               return wAgo(1);
  if(s.includes('شهر'))                 return mAgo(1);
  if(s.match(/(\d+)\s*شهر/))            return mAgo(parseInt(s.match(/(\d+)/)[1]));
  if(s.includes('week ago')||s.includes('week')) return wAgo(1);
  if(s.includes('month'))               return mAgo(1);

  // ── Year-only or range ──
  const yrOnly = s.match(/\b(20\d\d)\b/);
  if(yrOnly) return parseInt(yrOnly[1])*10000 + 101; // Jan 1 of that year

  // ── Fallbacks ──
  if(s.includes('ongoing')||s.includes('مستمر')) return toN(now)-365;
  if(s.includes('ready')||s.includes('جاهز'))   return toN(now);
  return 0;
}

      return db-da;
    });
  }
  return cards; // 'priority' = original order
}

function buildVectorCard(v,lang){
  const d=v[lang];

  if(!d) return '';
  if(ACTIVE_DOMAIN!=='all' && !(v.domains||[]).includes(ACTIVE_DOMAIN)) return '';
  const vt=l.verdicts[v.verdict];
  const vCls={go:'v-go',pilot:'v-pilot',plan:'v-plan',long:'v-long'}[v.verdict];
  const domTags=(v.domains||[]).map(id=>`<span class="dtag ${id===ACTIVE_DOMAIN?'active-domain':''}" onclick="setDomain('${id}')">${domainName(id,lang)}</span>`).join('');
  const tags=d.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  const rows=l.dims.map((dim,i)=>{
    const n=d.fRows[i]||1;
    return`<div class="frow"><span class="frow-lbl">${dim}</span>${fillBar(n)}<span class="frow-val" style="color:${FILL_COLORS[n-1]}">${l.dimVals[i][n-1]}</span></div>`;
  }).join('');
  return`<div class="card p1">

    <div class="card-title">${d.title}</div>
    <div class="card-org">${d.org}</div>
    <div class="card-body">${d.body}</div>

function buildAISignal(s,lang){
  const d=s[lang];
  if(!d) return '';
  if(ACTIVE_DOMAIN!=='all' && !(s.domains||[]).includes(ACTIVE_DOMAIN)) return '';
  const catMap={Release:'bdg-green',Breakthrough:'bdg-blue',Policy:'bdg-amber',Security:'bdg-red',Funding:'bdg-teal',Research:'bdg-gray',

function sectionBlock(key,lang,cards){
  const l=L[lang];
  const filtered=sortCards(cards.filter(c=>c.sec===key && domainMatch(c)));
  if(!filtered.length) return '';
  const [icon,title,sub]=l.secTitles[key];
  const bgs={city:'var(--teal-lt)',construction:'var(--amber-lt)',food:'var(--green-lt)',housing:'var(--blue-lt)'};
  return`<div class="sec-hd"><div class="sec-icon" style="background:${bgs[key]||'var(--paper3)'}">${icon}</div><div><div class="sec-title">${title}</div><div class="sec-sub">${sub}</div></div></div>
    <div class="grid">${filtered.map(c=>buildCard(c,lang)).join('')}</div><div class="sec-div"></div>`;
}

function buildStats(ns,ls){
  return`<div class="stats">${ns.map((n,i)=>`<div class="stat"><div class="stat-n">${n}</div><div class="stat-l">${ls[i]}</div></div>`).join('')}</div>`;
}

function buildLegend(lang){
  const l=L[lang];
  const items=l.legendItems.map((lb,i)=>`<span style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink2)"><span style="display:inline-block;width:22px;height:5px;border-radius:2px;background:${FILL_COLORS[i]}"></span>${lb}</span>`).join('');
  const vts=Object.entries(l.verdicts).map(([k,v])=>`<span class="verdict ${{go:'v-go',pilot:'v-pilot',plan:'v-plan',long:'v-long'}[k]}" style="font-size:8px">${v}</span>`).join('');

}

function buildDecisionTable(lang){
  const l=L[lang];
  const dots=n=>'●'.repeat(n)+'○'.repeat(5-n);
  const vCls={go:'v-go',pilot:'v-pilot',plan:'v-plan',long:'v-long'};
  const rows=DT_ROWS.map(r=>{
    const nm=lang==='en'?r.en:r.ar;
    const dc=r.dims.map((n,i)=>`<td><span style="color:${FILL_COLORS[n-1]};font-weight:700">${dots(n)}</span></td>`).join('');
    return`<tr><td>${nm}</td>${dc}<td><span class="verdict ${vCls[r.verdict]}" style="font-size:8px">${l.verdicts[r.verdict]}</span></td></tr>`;
  }).join('');
  const ths=l.dtHeaders.map(h=>`<th>${h}</th>`).join('');
  return`<div class="sec-hd"><div class="sec-icon" style="background:var(--paper3)">📊</div><div><div class="sec-title">${l.decisionTitle}</div><div class="sec-sub">${l.decisionSub}</div></div></div>
    <div style="overflow-x:auto"><table class="dtable"><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>

function buildSidebar(lang){
  const l=L[lang];
  const bc={teal:'teal-lt',amber:'amber-lt',blue:'blue-lt',green:'green-lt',purple:'purple-lt',gray:'paper3'};
  const tc={teal:'teal',amber:'amber',blue:'blue',green:'green',purple:'purple',gray:'ink3'};

  // ── AUTO-POPULATE from live INSPECT cards (newest 8) ──────────────
  const domainColor = {
    'smart-city':'teal','construction':'amber','food':'green',
    'housing':'blue','policy':'purple','security':'red'
  };
  const livePris = [...INSPECT]
    .sort((a,b) => parseDateNum((b[lang]||b.en)?.date||'') - parseDateNum((a[lang]||a.en)?.date||''))
    .slice(0, 8)
    .map(c => {
      const d = c[lang] || c.en;
      const domClr = domainColor[c.domains?.[0]] || 'gray';
      const dateStr = d?.date || '';
      const titleStr = d?.title || '';
      // Truncate title to ~55 chars
      const shortTitle = titleStr.length > 55 ? titleStr.slice(0,55)+'…' : titleStr;
      const srcLink = c.url ? `<a href="${c.url}" target="_blank" rel="noopener" class="sb-src-link">↗ ${(()=>{try{return new URL(c.url).hostname.replace(/^www\./,'')}catch(e){return 'src'}})()}</a>` : '';
      return `<div class="mini"><div class="mini-t">${shortTitle}</div><div class="mini-m"><span class="mini-bdg" style="background:var(--${bc[domClr]||'paper3'});color:var(--${tc[domClr]||'ink3'})">${dateStr}</span>${srcLink}</div></div>`;
    }).join('');

  // ── AUTO-POPULATE Breaking from live AI_SIGNALS (newest 5) ──────────
  const catClr={'Release':'teal','Breakthrough':'teal','Policy':'amber','Security':'red','Funding':'green','Research':'gray',
    'إطلاق':'teal','اختراق':'teal','سياسة':'amber','أمن':'red','تمويل':'green','بحث':'gray'};
  const brk=[...AI_SIGNALS]
    .sort((a,b)=>parseDateNum((b[lang]||b.en)?.d||'')-parseDateNum((a[lang]||a.en)?.d||''))
    .slice(0,5)
    .map(s=>{
      const d=s[lang]||s.en;
      const clr=catClr[d?.cat]||'gray';
      const title=(d?.t||'').slice(0,55)+((d?.t||'').length>55?'…':'');
      const srcLink2 = s.url ? `<a href="${s.url}" target="_blank" rel="noopener" class="sb-src-link">↗ ${(()=>{try{return new URL(s.url).hostname.replace(/^www\./,'')}catch(e){return 'src'}})()}</a>` : '';
      return `<div class="mini"><div class="mini-t">${title}</div><div class="mini-m"><span class="mini-bdg" style="background:var(--${bc[clr]||'paper3'});color:var(--${tc[clr]||'ink3'})">${d?.d||''}</span>${srcLink2}</div></div>`;
    }).join('');

  const rc={teal:'var(--teal)',amber:'var(--amber)',blue:'var(--blue)',ink3:'var(--ink3)'};
  const reviewedLabel = lang==='ar'
    ? `آخر مراجعة: ${computeNewestDate(lang)}`
    : `Last reviewed: ${computeNewestDate(lang)}`;
  const rm = l.sbRoadmap.map(r =>
    `<div class="rm-item" style="border-color:${rc[r.c]||'var(--paper3)'}"><h4 style="color:${rc[r.c]||'var(--ink3)'}">${r.h}</h4><p>${r.p}</p></div>`
  ).join('') + `<div style="font-size:9px;font-family:'DM Mono',monospace;color:var(--ink4);margin-top:6px">${reviewedLabel}</div>`;

  return `<div class="sb-sec"><div class="sb-title">${l.sbPriTitle}</div>${livePris}</div>` +
         `<div class="sb-sec"><div class="sb-title">${l.sbBreakTitle}</div>${brk}</div>` +
         `<div class="sb-sec"><div class="sb-title">${l.sbRoadTitle}</div>${rm}</div>`;
}

// COUNT signals per domain for filter bar
// ════════════════════════════════════════════════════════════════
function countForDomain(domId,tabId){
  if(domId==='all') return null; // shows total
  let total=0;
  if(tabId==='inspect'){
    total+=INSPECT.filter(c=>(c.domains||[]).includes(domId)).length;
  } else if(tabId==='apply'){
    total+=VECTORS.filter(v=>(v.domains||[]).includes(domId)).length;
  } else if(tabId==='ai'){
    total+=AI_SIGNALS.filter(s=>(s.domains||[]).includes(domId)).length;
  }
  return total;
}

function renderNav(lang){

function renderDomainBar(lang){

    return`<button class="dfbtn ${ACTIVE_DOMAIN===d.id?'active':''}" onclick="setDomain('${d.id}')">${d.emoji} ${label}${badge}</button>`;
  }).join('');

  const byDateLabel=lang==='ar'?'📅 حسب التاريخ':'📅 Date';
  const byPriLabel=lang==='ar'?'⭐ حسب الأهمية':'⭐ Priority';
  const sortBtns=`<span style="margin-inline-start:auto;display:flex;gap:4px;align-items:center;flex-shrink:0">

  </span>`;

function renderTab(tabId,lang){
  const l=L[lang];
  const noRes=`<div class="empty-state"><span>🔍</span>${l.noResults}</div>`;

  if(tabId==='inspect'){
    const secs=['city','construction','food','housing'];
    // Override count with live INSPECT.length; other stats remain editorial
    const liveStats=[String(INSPECT.length),...l.stats_inspect.slice(1)];
    const html=buildStats(liveStats,l.stats_inspect_l)+secs.map(s=>sectionBlock(s,lang,INSPECT)).join('');
    const hasContent=secs.some(s=>INSPECT.filter(c=>c.sec===s&&domainMatch(c)).length>0);
    return html+(hasContent?'':noRes);
  }
  if(tabId==='apply'){
    const [icon,title,sub]=l.secTitles.vectors;
    const cards=VECTORS.map(v=>buildVectorCard(v,lang)).filter(Boolean).join('');
    const hasContent=VECTORS.some(v=>ACTIVE_DOMAIN==='all'||(v.domains||[]).includes(ACTIVE_DOMAIN));
    return buildStats(l.stats_apply,l.stats_apply_l)+buildLegend(lang)+
      `<div class="sec-hd"><div class="sec-icon" style="background:var(--teal-lt)">${icon}</div><div><div class="sec-title">${title}</div><div class="sec-sub">${sub}</div></div></div>`+
      `<div class="grid">${cards}</div><div class="sec-div"></div>`+buildDecisionTable(lang);
  }
  if(tabId==='ai'){
    const [icon,title,sub]=l.secTitles.global;
    const sorted=SORT_MODE==='date'
      ? [...AI_SIGNALS.filter(s=>domainMatch(s))].sort((a,b)=>parseDateNum((b[LANG]||b.en)?.d||'')-parseDateNum((a[LANG]||a.en)?.d||''))
      : AI_SIGNALS.filter(s=>domainMatch(s));
    const cards=sorted.map(s=>buildAISignal(s,lang)).filter(Boolean).join('');
    const hasContent=AI_SIGNALS.some(s=>domainMatch(s));
    const liveSub=lang==='ar'?`${AI_SIGNALS.length} إشارة — نماذج حدودية، بنية تحتية، جيوسياسة`:`${AI_SIGNALS.length} signals — frontier models, infrastructure, geopolitics`;
    return`<div class="sec-hd"><div class="sec-icon" style="background:var(--paper3)">${icon}</div><div><div class="sec-title">${title}</div><div class="sec-sub">${liveSub}</div></div></div>`+
      `<div class="grid">${cards}</div>`+(hasContent?'':noRes);
  }
  return '';
}

// Compute the date of the newest signal across all data
function computeNewestDate(lang){
  let maxNum=0;
  [...INSPECT,...AI_SIGNALS].forEach(s=>{
    const d=s[lang]||s.en;
    const n=parseDateNum(d?.date||d?.d||'');
    if(n>maxNum) maxNum=n;
  });
  if(!maxNum) return lang==='ar'?'غير معروف':'Unknown';
  const yr=Math.floor(maxNum/10000);
  const mo=Math.floor((maxNum%10000)/100);
  const dy=maxNum%100;
  if(lang==='ar'){
    const m=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return `${dy} ${m[mo]} ${yr}`;
  }
  const m=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${m[mo]} ${dy}, ${yr}`;
}

// Total live signal count
function totalSignals(){ return INSPECT.length + AI_SIGNALS.length; }

function render(lang){
  const l=L[lang];
  const root=document.getElementById('root');
  root.setAttribute('lang',lang);
  root.setAttribute('dir',lang==='ar'?'rtl':'ltr');
  document.getElementById('wm').innerHTML=lang==='ar'?`${l.wm[0]}<span>${l.wm[1]}</span>`:`${l.wm[0]}<span>${l.wm[1]}</span>`;
  document.getElementById('tl').textContent=l.tl;
  // Dynamic — always reflect actual newest signal date and live count
  // Header date = today's actual date from browser clock
  const todayDate=(()=>{const n=new Date();if(lang==='ar'){const m=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];return n.getDate()+' '+m[n.getMonth()+1]+' '+n.getFullYear();}return n.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});})();
  document.getElementById('scan-date').textContent=todayDate;
  document.getElementById('sig-count').textContent=totalSignals()+(lang==='ar'?' إشارة':' signals');
  document.getElementById('nav-tabs').innerHTML=renderNav(lang);

    sb.style.cssText='margin:8px 20px 0;padding:8px 12px;border-radius:7px;background:var(--amber-lt);color:var(--amber);font-size:11px;font-family:\'DM Mono\',monospace';
    sb.textContent=lang==='ar'
      ?'⚠️ محتوى أولي — سيتم استبدال بطاقات التفتيش وإشارات السوق بالكامل عند أول تشغيل لـ radar_rescan.py'
      :'⚠️ Seed content — INSPECT cards and Market Intel are replaced in full on the first radar_rescan.py run';

  document.getElementById('domain-filter-bar').innerHTML=renderDomainBar(lang);
  document.getElementById('main-content').innerHTML=renderTab(ACTIVE_TAB,lang);

function buildInvPanel(lang){
  const d=INV[lang];
  const sl=SIG_LABELS;
  const newestDate=computeNewestDate(lang);

  // Staleness check — warn if investment data is >14 days older than newest signal
  // ══ INV-DATA-DATE ══
  const invDataDate=20260920;
  // ══ /INV-DATA-DATE ══
  const newestNum=computeNewestDate('en'); // get the raw number via a helper
  const isStale=parseDateNum(computeNewestDate('en'))>invDataDate+14;

  const invAsOf=(()=>{const y=Math.floor(invDataDate/10000),mo=Math.floor((invDataDate%10000)/100),dy=invDataDate%100;
    if(lang==='ar'){const m=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];return `${dy} ${m[mo]} ${y}`;}
    const m=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${m[mo]} ${dy}, ${y}`;})();
  const timestampLabel=lang==='ar'
    ?`📅 بيانات الاستثمار من: ${invAsOf} · أحدث الإشارات: ${newestDate}`
    :`📅 Investment data as of: ${invAsOf} · Newest signals: ${newestDate}`;
  const staleWarning=isStale
    ?(lang==='ar'
      ?'⚠️ بيانات الاستثمار قد تكون قديمة — يُنصح بمراجعة يدوية'
      :'⚠️ Investment ratings may be stale — manual review recommended')
    :'';

  const timestampHtml=`<div style="margin-bottom:14px;padding:9px 12px;background:var(--paper2);border-radius:7px;border:.5px solid var(--line)">
    <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--ink3)">${timestampLabel}</div>
    ${staleWarning?`<div style="margin-top:5px;font-size:10px;font-family:'DM Mono',monospace;color:var(--amber)">${staleWarning}</div>`:''}
  </div>`;

  const stocks=d.stocks.map(s=>`<div class="stock-row">
    <div class="stock-ticker">${s.ticker}</div>
    <div class="stock-name">${s.name}</div>
    <div class="stock-signal sig-${s.signal}">${sl[s.signal][lang]}</div>
    <div class="stock-why">${s.why}</div>
  </div>`).join('');
  const opps=d.opps.map(o=>`<div class="opp-card">
    <div class="opp-top"><div class="opp-title">${o.title}</div><span class="opp-horizon">${o.horizon}</span></div>
    <div class="opp-body">${o.body}</div>
    <div class="opp-tickers">${o.tickers.map(t=>`<span class="opp-ticker">${t}</span>`).join('')}</div>
  </div>`).join('');
  const risks=d.risks.map(r=>`<div class="risk-row">
    <div class="risk-icon">${r.icon}</div>
    <div class="risk-text"><strong>${r.title}</strong>${r.body}</div>
  </div>`).join('');
  return timestampHtml+
    `<div class="inv-block"><div class="inv-sec-title">${d.stocksTitle}</div>${stocks}</div>
    <div class="inv-block"><div class="inv-sec-title">${d.oppsTitle}</div>${opps}</div>
    <div class="inv-block"><div class="inv-sec-title">${d.risksTitle}</div>${risks}</div>`;
}

function openInv(){
  document.getElementById('inv-overlay').classList.add('open');
  document.getElementById('inv-drawer').classList.add('open');
  document.getElementById('inv-title').textContent=INV[LANG].title;
  document.getElementById('inv-disclaimer').textContent=INV[LANG].disclaimer;
  document.getElementById('inv-body').innerHTML=buildInvPanel(LANG);
}
function closeInv(){
  document.getElementById('inv-overlay').classList.remove('open');
  document.getElementById('inv-drawer').classList.remove('open');
}
