<!DOCTYPE html>
<html lang="en" dir="ltr" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Radar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f0f0e;--ink2:#3a3a36;--ink3:#7a7a72;--ink4:#b8b8b0;
  --paper:#f6f4ef;--paper2:#eeecea;--paper3:#e4e2d8;
  --teal:#1a7f6e;--teal-lt:#d4f0ea;
  --amber:#c47a1a;--amber-lt:#fdf0d4;
  --red:#c0392b;--red-lt:#fde8e6;
  --blue:#1a5fa8;--blue-lt:#deeaf7;
  --green:#2a6b3c;--green-lt:#dff2e5;
  --purple:#6c3fa8;--purple-lt:#ede8f8;
  --line:rgba(0,0,0,.1);--radius:10px;
}
@media(prefers-color-scheme:dark){
  :root{
    --ink:#f0eeea;--ink2:#c8c6be;--ink3:#8a8a82;--ink4:#5a5a52;
    --paper:#141412;--paper2:#1e1e1a;--paper3:#282824;
    --teal:#2aad93;--teal-lt:#0a2e28;--amber:#e09030;--amber-lt:#2e1e04;
    --red:#e05545;--red-lt:#2e0e0a;--blue:#4a8fd0;--blue-lt:#0a1e32;
    --green:#4a9b62;--green-lt:#0a2016;--purple:#a07de0;--purple-lt:#1e1230;
    --line:rgba(255,255,255,.1);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
[dir="rtl"] body,[dir="rtl"]{font-family:'Cairo',sans-serif}

/* HEADER */
.hd{background:var(--ink);color:var(--paper);padding:16px 24px;position:sticky;top:0;z-index:200;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.wm{font-family:'DM Serif Display',serif;font-size:20px;letter-spacing:-.4px;line-height:1}
[dir="rtl"] .wm{font-family:'Cairo',sans-serif;font-weight:900;font-size:18px;letter-spacing:0}
.wm span{color:var(--teal)}
.tl{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.1em;color:var(--ink4);margin-top:2px;text-transform:uppercase}
[dir="rtl"] .tl{font-family:'Cairo',sans-serif;font-size:10px;letter-spacing:0;text-transform:none}
.hd-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.hbadge{font-size:9px;font-family:'DM Mono',monospace;padding:3px 9px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:var(--ink4)}
[dir="rtl"] .hbadge{font-family:'Cairo',sans-serif;font-size:10px}
.hbadge.live{border-color:var(--teal);color:var(--teal);display:flex;align-items:center;gap:5px}
.pulse{width:6px;height:6px;background:var(--teal);border-radius:50%;animation:pl 2s infinite;flex-shrink:0}
@keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.lang-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.lang-btn{font-size:10px;font-weight:600;padding:4px 12px;cursor:pointer;background:transparent;border:none;color:var(--ink4);font-family:'DM Mono',monospace}
.lang-btn.active{background:var(--teal);color:#fff}

/* NAV */
.nav{background:var(--paper3);border-bottom:1px solid var(--line);padding:0 24px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:60px;z-index:190}
.nav-tab{font-size:10px;font-family:'DM Mono',monospace;font-weight:500;padding:12px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--ink3);border:none;background:none;display:flex;align-items:center;gap:5px;letter-spacing:.05em;text-transform:uppercase;transition:all .15s}
[dir="rtl"] .nav-tab{font-family:'Cairo',sans-serif;font-size:11px;letter-spacing:0;text-transform:none;font-weight:700}
.nav-tab.active,.nav-tab:hover{color:var(--ink);border-bottom-color:var(--teal)}
.nav-tab .cnt{font-size:8px;background:var(--paper);padding:1px 5px;border-radius:10px;color:var(--ink3)}
.nav-tab.active .cnt{background:var(--teal);color:#fff}

/* DOMAIN FILTER BAR */
.dfbar{background:var(--paper2);border-bottom:1px solid var(--line);padding:8px 24px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;position:sticky;top:106px;z-index:180}
.dfbar-label{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;margin-right:4px}
[dir="rtl"] .dfbar-label{font-family:'Cairo',sans-serif;letter-spacing:0;text-transform:none;font-size:10px;font-weight:700;margin-right:0;margin-left:4px}
.dfbtn{font-size:9px;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:20px;border:.5px solid var(--line);background:transparent;color:var(--ink3);cursor:pointer;white-space:nowrap;transition:all .15s}
[dir="rtl"] .dfbtn{font-family:'Cairo',sans-serif;font-size:10px;font-weight:600;letter-spacing:0}
.dfbtn:hover,.dfbtn.active{color:var(--ink);border-color:var(--teal);background:var(--teal-lt)}
.dfbtn.active{font-weight:700;background:var(--teal);color:#fff;border-color:var(--teal)}
.df-count{font-size:8px;margin-inline-start:3px;opacity:.8}

/* LAYOUT */
.body{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 150px)}
@media(max-width:860px){.body{grid-template-columns:1fr}}
.main{padding:20px 24px;border-right:1px solid var(--line)}
[dir="rtl"] .main{border-right:none;border-left:1px solid var(--line)}
.sidebar{padding:18px;background:var(--paper2)}

/* SECTION */
.sec-hd{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sec-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sec-title{font-family:'DM Serif Display',serif;font-size:18px;line-height:1.2}
[dir="rtl"] .sec-title{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px}
.sec-sub{font-size:10px;color:var(--ink3);margin-top:1px}
[dir="rtl"] .sec-sub{font-size:11px}
.sec-div{height:1px;background:var(--line);margin:20px 0}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.stat{background:var(--paper);padding:10px 12px;text-align:center}
.stat-n{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);line-height:1}
[dir="rtl"] .stat-n{font-family:'Cairo',sans-serif;font-weight:900;font-size:19px}
.stat-l{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
[dir="rtl"] .stat-l{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}

/* CARDS */
.grid{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:6px}
.card{background:var(--paper);border:.5px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--teal);box-shadow:0 2px 12px rgba(0,0,0,.07)}
.card.p1{border-inline-start:3px solid var(--teal)}
.card.p2{border-inline-start:3px solid var(--amber)}
.card.p3{border-inline-start:3px solid var(--blue)}
.card.pnew{border-inline-start:3px solid #378ADD}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.bdg{font-size:8px;font-family:'DM Mono',monospace;font-weight:500;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
[dir="rtl"] .bdg{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}
.bdg-teal{background:var(--teal-lt);color:var(--teal)}.bdg-amber{background:var(--amber-lt);color:var(--amber)}
.bdg-red{background:var(--red-lt);color:var(--red)}.bdg-blue{background:var(--blue-lt);color:var(--blue)}
.bdg-green{background:var(--green-lt);color:var(--green)}.bdg-gray{background:var(--paper3);color:var(--ink3)}
.bdg-purple{background:var(--purple-lt);color:var(--purple)}
/* domain tag pills on card */
.card-domains{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.dtag{font-size:8px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:3px;cursor:pointer;transition:all .12s;border:.5px solid var(--line);color:var(--ink3);background:var(--paper2)}
[dir="rtl"] .dtag{font-family:'Cairo',sans-serif;font-size:9px;letter-spacing:0}
.dtag:hover,.dtag.active-domain{background:var(--teal);color:#fff;border-color:var(--teal)}
.card-title{font-size:12.5px;font-weight:600;line-height:1.45;color:var(--ink);margin-bottom:3px}
[dir="rtl"] .card-title{font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;line-height:1.5}
.card-org{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink3);margin-bottom:5px}
[dir="rtl"] .card-org{font-family:'Cairo',sans-serif;font-size:10px}
.card-body{font-size:11px;line-height:1.65;color:var(--ink2);flex:1}
[dir="rtl"] .card-body{font-family:'Cairo',sans-serif;font-size:12px;line-height:1.8}

/* INNOVATION BOX */
.inno{background:var(--teal-lt);border:1px solid var(--teal);border-radius:7px;padding:10px 12px;margin-top:8px}
.inno-lbl{font-size:8px;font-family:'DM Mono',monospace;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:4px;display:flex;align-items:center;gap:4px}
[dir="rtl"] .inno-lbl{font-family:'Cairo',sans-serif;font-size:10px;text-transform:none;letter-spacing:0;font-weight:700}
.inno-lbl::before{content:'';width:5px;height:5px;background:var(--teal);border-radius:50%;flex-shrink:0}
.inno-txt{font-size:11px;line-height:1.6;color:var(--ink2)}
[dir="rtl"] .inno-txt{font-family:'Cairo',sans-serif;font-size:12px;line-height:1.75}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.tag{font-size:8px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:3px;background:rgba(26,127,110,.1);color:var(--teal)}
[dir="rtl"] .tag{font-family:'Cairo',sans-serif;font-size:9px;font-weight:600}

/* FEASIBILITY */
.fmat{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fmat-hd{background:var(--paper3);padding:7px 12px;display:flex;align-items:center;justify-content:space-between}
[dir="rtl"] .fmat-hd{flex-direction:row-reverse}
.fmat-lbl{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
[dir="rtl"] .fmat-lbl{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}
.verdict{font-size:9px;font-family:'DM Mono',monospace;font-weight:700;padding:3px 9px;border-radius:4px}
[dir="rtl"] .verdict{font-family:'Cairo',sans-serif;font-size:10px}
.v-go{background:#2a6b3c;color:#fff}.v-pilot{background:#c47a1a;color:#fff}
.v-plan{background:#1a5fa8;color:#fff}.v-long{background:#5a5a72;color:#fff}
.frows{padding:8px 12px;display:grid;gap:5px}
.frow{display:grid;grid-template-columns:120px 1fr 70px;align-items:center;gap:8px}
[dir="rtl"] .frow{grid-template-columns:70px 1fr 120px;direction:rtl}
.frow-lbl{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink3)}
[dir="rtl"] .frow-lbl{font-family:'Cairo',sans-serif;font-size:10px;font-weight:600;text-align:right;color:var(--ink2)}
.fbar{height:5px;background:var(--paper3);border-radius:3px;overflow:hidden}
.fbar-fill{height:100%;border-radius:3px}
.f1{width:20%;background:var(--green)}.f2{width:40%;background:#6ab04c}
.f3{width:60%;background:var(--amber)}.f4{width:80%;background:#e07020}.f5{width:100%;background:var(--red)}
.frow-val{font-size:9px;font-family:'DM Mono',monospace;font-weight:600;text-align:right;color:var(--ink2)}
[dir="rtl"] .frow-val{font-family:'Cairo',sans-serif;font-size:10px;font-weight:700}
.fmat-ft{background:var(--paper2);padding:7px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fft{font-size:10px;line-height:1.55;color:var(--ink2)}
[dir="rtl"] .fft{font-family:'Cairo',sans-serif;font-size:11px;line-height:1.65}
.fft strong{font-size:8px;font-family:'DM Mono',monospace;display:block;color:var(--ink3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em}
[dir="rtl"] .fft strong{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}

/* CARD FOOTER */
.cft{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
[dir="rtl"] .cft{flex-direction:row-reverse}
.cft-date{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink4)}
[dir="rtl"] .cft-date{font-family:'Cairo',sans-serif;font-size:9px}
.cft-link{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink3);text-decoration:none;display:flex;align-items:center;gap:3px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cft-link:hover{color:var(--teal)}
[dir="rtl"] .cft-link{font-family:'Cairo',sans-serif;font-size:9px}

/* DECISION TABLE */
.dtable{width:100%;border-collapse:collapse;font-size:10px}
.dtable th{padding:8px 6px;text-align:center;font-size:8px;font-family:'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line);background:var(--paper3);font-weight:500}
[dir="rtl"] .dtable th{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}
.dtable th:first-child{text-align:left;padding-inline-start:12px}
.dtable td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);color:var(--ink2)}
.dtable td:first-child{text-align:left;padding-inline-start:12px;font-size:10px;font-weight:600;color:var(--ink)}
[dir="rtl"] .dtable td:first-child{font-family:'Cairo',sans-serif;font-size:11px}
.dtable tr:last-child td{border-bottom:none}

/* LEGEND BAR */
.lgd{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:8px 12px;background:var(--paper2);border-radius:8px;border:.5px solid var(--line)}

/* SIDEBAR */
.sb-sec{margin-bottom:20px}
.sb-title{font-size:8px;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
[dir="rtl"] .sb-title{font-family:'Cairo',sans-serif;font-size:9px;text-transform:none;letter-spacing:0;font-weight:700}
.mini{padding:8px 10px;border-radius:7px;background:var(--paper);border:.5px solid var(--line);margin-bottom:5px}
.mini-t{font-size:11px;font-weight:500;color:var(--ink);line-height:1.4;margin-bottom:2px}
[dir="rtl"] .mini-t{font-family:'Cairo',sans-serif;font-size:11px;font-weight:700}
.mini-m{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink3);display:flex;align-items:center;gap:5px}
[dir="rtl"] .mini-m{font-family:'Cairo',sans-serif;font-size:9px;flex-direction:row-reverse;justify-content:flex-end}
.mini-bdg{font-size:8px;padding:1px 5px;border-radius:3px;font-family:'DM Mono',monospace}
[dir="rtl"] .mini-bdg{font-family:'Cairo',sans-serif;font-size:8px;font-weight:600}
.rm-item{padding-inline-start:12px;border-inline-start:2px solid;margin-bottom:9px}
.rm-item h4{font-size:11px;font-weight:600}
.sb-src-link{font-size:8px;font-family:'DM Mono',monospace;color:var(--ink3);text-decoration:none;margin-inline-start:6px;white-space:nowrap}
.sb-src-link:hover{color:var(--teal)}
[dir="rtl"] .sb-src-link{font-family:'Cairo',sans-serif}
[dir="rtl"] .rm-item h4{font-family:'Cairo',sans-serif;font-size:12px}
.rm-item p{font-size:10px;line-height:1.6;color:var(--ink2);margin-top:2px}
[dir="rtl"] .rm-item p{font-family:'Cairo',sans-serif;font-size:11px;line-height:1.7}

/* EMPTY STATE */
.empty-state{padding:40px 24px;text-align:center;color:var(--ink3);font-size:13px}
.empty-state span{font-size:32px;display:block;margin-bottom:10px}

/* PANEL */
.panel{display:none}.panel.active{display:block}

/* ── INVESTMENT PANEL ── */
.inv-fab{position:fixed;bottom:28px;right:28px;z-index:500;background:var(--ink);color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .2s,box-shadow .2s;font-family:'DM Sans',sans-serif}
[dir="rtl"] .inv-fab{right:auto;left:28px;font-family:'Cairo',sans-serif}
.inv-fab:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,0,0,.35)}
.inv-fab .pulse-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:pl 2s infinite;flex-shrink:0}
.inv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;opacity:0;pointer-events:none;transition:opacity .3s}
.inv-overlay.open{opacity:1;pointer-events:all}
.inv-drawer{position:fixed;top:0;right:-520px;width:500px;max-width:95vw;height:100vh;background:var(--paper);z-index:700;overflow-y:auto;transition:right .35s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 32px rgba(0,0,0,.2);display:flex;flex-direction:column}
[dir="rtl"] .inv-drawer{right:auto;left:-520px;transition:left .35s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 32px rgba(0,0,0,.2)}
.inv-drawer.open{right:0}
[dir="rtl"] .inv-drawer.open{left:0;right:auto}
.inv-header{background:var(--ink);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
[dir="rtl"] .inv-header{flex-direction:row-reverse}
.inv-header h2{font-family:'DM Serif Display',serif;font-size:18px;letter-spacing:-.3px}
[dir="rtl"] .inv-header h2{font-family:'Cairo',sans-serif;font-weight:900;font-size:17px}
.inv-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.inv-body{padding:18px 20px;flex:1}
.inv-disclaimer{margin:0 20px 14px;padding:9px 12px;background:var(--amber-lt);border:1px solid var(--amber);border-radius:7px;font-size:10px;font-family:'DM Mono',monospace;color:var(--amber);line-height:1.5}
[dir="rtl"] .inv-disclaimer{font-family:'Cairo',sans-serif;font-size:11px}
.inv-sec-title{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:10px}
[dir="rtl"] .inv-sec-title{font-family:'Cairo',sans-serif;font-size:10px;text-transform:none;letter-spacing:0;font-weight:700}
.inv-block{margin-bottom:22px}
/* Stock rows */
.stock-row{display:grid;grid-template-columns:70px 1fr 80px 90px;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--paper2);margin-bottom:5px;border:.5px solid var(--line)}
[dir="rtl"] .stock-row{direction:rtl}
.stock-ticker{font-family:'DM Mono',monospace;font-weight:700;font-size:12px;color:var(--ink)}
.stock-name{font-size:11px;color:var(--ink2);line-height:1.3}
[dir="rtl"] .stock-name{font-family:'Cairo',sans-serif;font-size:12px}
.stock-signal{font-size:9px;font-family:'DM Mono',monospace;font-weight:700;padding:2px 8px;border-radius:4px;text-align:center;white-space:nowrap}
[dir="rtl"] .stock-signal{font-family:'Cairo',sans-serif;font-size:10px}
.sig-buy{background:#dff2e5;color:#2a6b3c}
.sig-watch{background:#fdf0d4;color:#c47a1a}
.sig-caution{background:#fde8e6;color:#c0392b}
.sig-ipo{background:#ede8f8;color:#6c3fa8}
.stock-why{font-size:9px;color:var(--ink3);line-height:1.4}
[dir="rtl"] .stock-why{font-family:'Cairo',sans-serif;font-size:10px}
/* Opportunity cards */
.opp-card{border-radius:9px;border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;background:var(--paper)}
.opp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
[dir="rtl"] .opp-top{flex-direction:row-reverse}

    tags:['LiDAR detection','safety robots','3D point clouds','worker tracking'],date:'November 17, 2026'},
   ar:{badges:[["teal", "جديد"], ["amber", "بناء"], ["teal", "تفتيش"]],title:'دقة الكشف بتقنية LIDAR تتحسن بنسبة 4.69٪ لفحص السلامة الروبوتية في المواقع',org:'بحوث المواد منخفضة الكربون · الصين',
    body:'خوارزمية CRobot-SECOND حسنت الكشف عن السحب النقطية ثلاثية الأبعاد لروبوتات السلامة في مواقع البناء في 17 نوفمبر 2026. تحسن الكشف عن العمال من 53.09٪ إلى 57.77٪ متوسط الدقة. تقنيات الدمج المتقدمة والآليات المركزية والتعويض الديناميكي للأشياء تمكن الروبوتات من تحديد العمال والمركبات بشكل موثوق.',
    inno:'تكتسب السلطات المختصة بالفحص رصدًا مستمرًا على مستوى الأرض بدقة كشف محسنة. تمكين الوكالات التنظيمية من نشر شبكات روبوتات المفتشين برصد الأخطار في الوقت الفعلي، مما يقلل وقت الفحص من أيام إلى ساعات مع تحسين توحيد توثيق الامتثال.',
    tags:['كشف LIDAR','روبوتات السلامة','السحب النقطية ثلاثية الأبعاد','تتبع العمال'],date:'17 نوفمبر 2026'}},
  {sec:'construction',p:'pnew',domains:["construction", "ai-models"],
   url:'https://www.forconstructionpros.com/equipment/equipment-technology/drones-and-unmanned-aerial-vehicles/article/22978439/zenadrone-ai-drone-monitoring-for-construction-sites',
   en:{badges:[["teal", "NEW"], ["amber", "Construction"], ["teal", "Inspect"]],title:'AI exception-based drone monitoring spots jobsite changes; reduces manual image review',org:'ZenaDrone · United States',
    body:'On Nov 21, 2026, ZenaDrone deployed exception-based AI screening for repeated drone missions. Automated change detection prioritizes jobsite issues instead of manual review of thousands of images. AI filters routine data, flagging only meaningful deviations from baseline conditions, enabling inspection teams to focus on critical findings requiring intervention.',
    inno:'Inspection authorities achieve scalable oversight of large construction sites with minimal human review burden. Exception-based filtering reduces false positives, enabling small inspection teams to monitor multiple sites concurrently. Automated baselines support compliance audits, change order documentation, and evidence preservation for regulatory proceedings.',
    tags:['exception-based monitoring','automated change detection','AI screening','construction compliance'],date:'November 21, 2026'},
   ar:{badges:[["teal", "جديد"], ["amber", "بناء"], ["teal", "تفتيش"]],title:'مراقبة الطائرات بدون طيار القائمة على الاستثناءات الذكية تكتشف تغييرات الموقع وتقلل المراجعة اليدوية',org:'ZenaDrone · الولايات المتحدة',
    body:'في 21 نوفمبر 2026، نشرت ZenaDrone فحص الاستثناءات بناءً على الذكاء الاصطناعي لبعثات الطائرات المتكررة. كشف التغيير الآلي يحدد أولويات مشاكل الموقع بدلاً من المراجعة اليدوية لآلاف الصور. تصفي الذكاء الاصطناعي البيانات الروتينية وتعلم فقط الانحرافات ذات المعنى.',
    inno:'تحقق السلطات المختصة بالفحص إشرافًا قابلاً للتوسع على مواقع البناء الكبيرة مع عبء مراجعة بشرية ضئيل. يقلل تصفية الاستثناءات الإيجابيات الكاذبة، مما يمكّن فرق الفحص الصغيرة من مراقبة مواقع متعددة في وقت واحد.',
    tags:['المراقبة القائمة على الاستثناءات','الكشف التلقائي عن التغييرات','الفحص الذكي','الامتثال في البناء'],date:'21 نوفمبر 2026'}},
  {sec:'construction',p:'p2',domains:["construction", "policy"],
   url:'https://www.cdc.gov/niosh/bulletin/2026/safety-in-construction-robotics.html',
   en:{badges:[["amber", "Construction"], ["teal", "Inspect"]],title:'NIOSH October 2026 robotics bulletin: New hazards emerge when humans and robots share space',org:'CDC/NIOSH · United States',
    body:'On Oct 7, 2026, NIOSH published \'Safety in Construction Robotics\' bulletin addressing deployment of autonomous equipment on jobsites. While robots reduce worker exposure to hazardous tasks, human-robot interaction creates new risks: software reliability failures, sensing limitations, communication breakdowns, and cybersecurity vulnerabilities. Continuous assessment of site conditions required.',
    inno:'Inspection authorities must establish safety protocols and verification frameworks for autonomous construction equipment before deployment approval. Guidance informs regulatory requirements for human-robot coordination zones, software validation, cybersecurity standards, and continuous monitoring procedures. Enable authorities to certify safe robotic deployment conditions and incident documentation.',
    tags:['NIOSH bulletin','robot safety','human-robot interaction','regulatory guidance'],date:'October 7, 2026'},
   ar:{badges:[["amber", "بناء"], ["teal", "تفتيش"]],title:'بيان NIOSH أكتوبر 2026 الروبوتات: أخطار جديدة تظهر عندما يشاركون المساحة',org:'مراكز السيطرة على الأمراض/NIOSH · الولايات المتحدة',
    body:'في 7 أكتوبر 2026، نشرت NIOSH نشرة \'السلامة في روبوتات البناء\' تتناول نشر المعدات المستقلة في مواقع العمل. بينما تقلل الروبوتات من تعرض العمال للمهام الخطرة، يخلق التفاعل بين الإنسان والآلة أخطارًا جديدة.',
    inno:'يجب على السلطات المختصة بالفحص وضع بروتوكولات السلامة وأطر التحقق من المعدات الإنشائية المستقلة قبل الموافقة على النشر. تعليمات تبلغ المتطلبات التنظيمية لمناطق التنسيق بين الإنسان والآلة وتحقق من صحة البرنامج.',
    tags:['نشرة NIOSH','سلامة الروبوتات','تفاعل الإنسان والآلة','الإرشادات التنظيمية'],date:'7 أكتوبر 2026'}},
  {sec:'construction',p:'p2',domains:["construction", "policy"],
   url:'https://www.tmcnet.com/usubmit/2026/10/01/10455998.htm',
   en:{badges:[["amber", "Construction"], ["teal", "Inspect"]],title:'OSHA enforcement up 8%; inspection apps now capture timestamped, photo-backed safety compliance',org:'SnapInspect · United States',
    body:'On Oct 1, 2026, OSHA enforcement reported running 8% ahead of prior year, with construction accounting for one-third of federal inspections. Per-violation penalties increased. SnapInspect and similar mobile inspection apps enable standardized checklists with real-time photo, timestamp, and location capture. Offline capability ensures documentation during active site work without connectivity delays.',
    inno:'Inspection authorities gain standardized, defensible compliance records to streamline audit procedures. Timestamped photo evidence creates unalterable documentation suitable for regulatory proceedings and dispute resolution. Mobile-first digital workflows reduce administrative overhead and enable field inspectors to generate compliance reports in real time, supporting faster corrective action cycles.',
    tags:['OSHA enforcement','mobile inspection','compliance documentation','photo timestamping'],date:'October 1, 2026'},
   ar:{badges:[["amber", "بناء"], ["teal", "تفتيش"]],title:'إنفاذ OSHA ارتفع 8٪؛ تطبيقات الفحص تلتقط الامتثال للسلامة مع الصور',org:'SnapInspect · الولايات المتحدة',
    body:'في 1 أكتوبر 2026، أفادت إنفاذ OSHA بأنها تسير 8٪ أسرع من السنة السابقة، حيث تمثل البناء ثلث الفحوصات الفيدرالية. تطبيقات فحص الهاتف المحمول مثل SnapInspect تمكن قوائم التحقق الموحدة مع التقاط الصور والطوابع الزمنية.',
    inno:'تحقق السلطات المختصة بالفحص سجلات امتثال موحدة وقابلة للدفاع لتبسيط إجراءات التدقيق. الصور الموثقة بطابع زمني تخلق توثيقًا لا يمكن تغييره مناسبًا للإجراءات التنظيمية. تدفق العمل الرقمي المحمول أولاً يقلل الحمل الإداري.',
    tags:['إنفاذ OSHA','فحص الهاتف المحمول','توثيق الامتثال','الصور المؤرخة'],date:'1 أكتوبر 2026'}},
  {sec:'food',p:'pnew',domains:["food", "policy"],
   url:'https://www.food-safety.com/articles/12030-how-fdas-human-foods-program-is-using-ai-to-support-food-safety-oversight',
   en:{badges:[["teal", "NEW"], ["green", "Food Safety"], ["teal", "Inspect"]],title:'FDA\'s Human Foods Program Deploys AI for Import Risk Prioritization, Adverse Event Detection & Labeling Compliance',org:'U.S. Food and Drug Administration · United States',
    body:'On November 18, 2026, FDA\'s Human Foods Program outlined its use of AI across food safety surveillance, regulatory, and nutrition activities. Machine learning prioritizes import inspections by predicting risk levels. AI monitors adverse event signals, analyzes contaminant/allergen testing data for contamination patterns, and uses computer vision for nutrition label compliance verification.',
    inno:'Inspection authorities can adopt AI-driven risk stratification for import screening, reducing inspection burden on lower-risk shipments while focusing resources on high-risk entries. Machine learning pattern detection enables data-driven compliance monitoring and predictive violation identification across supply chains.',
    tags:['import screening','risk prediction','labeling verification','regulatory efficiency'],date:'November 18, 2026'},
   ar:{badges:[["teal", "جديد"], ["green", "سلامة غذائية"], ["teal", "تفتيش"]],title:'برنامج FDA للأغذية البشرية يطبق الذكاء الاصطناعي لتحديد أولويات مخاطر الاستيراد والكشف عن الأحداث الضارة',org:'إدارة الغذاء والدواء الأمريكية · الولايات المتحدة',
    body:'في 18 نوفمبر 2026، أعلن برنامج FDA للأغذية البشرية عن استخدام الذكاء الاصطناعي في المراقبة والأنشطة اللائحية والتغذوية. تحدد نماذج التعلم الآلي أولويات فحوصات الاستيراد بالتنبؤ بمستويات المخاطر. يراقب الذكاء الاصطناعي إشارات الأحداث الضارة وتحليل بيانات الاختبار.',
    inno:'يمكن لسلطات الفحص اعتماد تصنيف المخاطر المدفوع بالذكاء الاصطناعي لفحص الاستيراد، مما يقلل عبء الفحص على الشحنات منخفضة المخاطر مع تركيز الموارد على الواردات عالية المخاطر.',
    tags:['فحص الاستيراد','التنبؤ بالمخاطر','التحقق من العلامات','الكفاءة التنظيمية'],date:'18 نوفمبر 2026'}},
  {sec:'food',p:'pnew',domains:["food", "policy"],
   url:'https://www.financialcontent.com/article/bizwire-2026-11-11-aib-international-brings-ai-to-everyday-food-safety-decisions-with-new-industry-focused-tools',
   en:{badges:[["teal", "NEW"], ["green", "Food Safety"], ["teal", "Inspect"]],title:'AIB International Launches AI Tools for GMP Gap Identification & Food Labeling Compliance Using Inspection Data',org:'AIB International · United States',
    body:'On November 11, 2026, AIB International announced Consolidated Standards Companion and Regulatory Assistant tools combining 100+ years of food safety expertise with decades of inspection data. AI identifies GMP program gaps and navigates complex labeling regulations across markets, reducing time staff spend searching for answers.',
    inno:'Inspection authorities can leverage AI analytics of historical violation patterns to design targeted inspection protocols, allocate resources to highest-risk areas, and establish evidence-based compliance benchmarks that reflect real-world facility issues found across thousands of inspections.',
    tags:['GMP compliance','inspection analytics','labeling regulations','risk insights'],date:'November 11, 2026'},
   ar:{badges:[["teal", "جديد"], ["green", "سلامة غذائية"], ["teal", "تفتيش"]],title:'شركة AIB تطلق أدوات ذكاء اصطناعي لتحديد فجوات GMP والامتثال لقوانين العلامات الغذائية',org:'شركة AIB الدولية · الولايات المتحدة',
    body:'في 11 نوفمبر 2026، أعلنت شركة AIB الدولية عن أدوات الرفيق المعياري الموحد والمساعد التنظيمي التي تجمع بين 100+ سنة من خبرة سلامة الأغذية مع عقود من بيانات الفحص.',
    inno:'يمكن لسلطات الفحص الاستفادة من تحليلات الذكاء الاصطناعي لأنماط الانتهاكات التاريخية لتصميم بروتوكولات فحص موجهة وتخصيص الموارد للمناطق الأكثر خطورة.',
    tags:['امتثال GMP','تحليلات الفحص','لوائح العلامات','رؤى المخاطر'],date:'11 نوفمبر 2026'}},
  {sec:'food',p:'p2',domains:["food", "ai-models"],
   url:'https://arxiv.org/pdf/2605.24503',
   en:{badges:[["green", "Food Safety"], ["teal", "Inspect"]],title:'FoodMonitor Benchmark for Explainable AI Compliance Analysis in Commercial Kitchen Surveillance Systems',org:'Academic Research · International',
    body:'FoodMonitor introduces a benchmark for explainable compliance monitoring in commercial kitchen surveillance, addressing unique challenges: mapping observations to predefined rules, generating structured detection outputs, and providing instance-level localization of violations spanning hygiene, PPE, and food handling violations.',
    inno:'Inspection authorities can adopt explainable AI systems that document not just violations but the reasoning behind detections, creating auditable records for enforcement and enabling staff to understand model decisions. This supports human-in-the-loop inspection workflows and builds public trust in automated monitoring.',
    tags:['explainability','kitchen compliance','video analysis','regulatory audit trail'],date:'May 12, 2026'},
   ar:{badges:[["green", "سلامة غذائية"], ["teal", "تفتيش"]],title:'معيار FoodMonitor للتحليل الممكّن بالذكاء الاصطناعي للامتثال في أنظمة المراقبة بالمطابخ التجارية',org:'البحث الأكاديمي · الدولي',
    body:'يقدم FoodMonitor معيارًا للمراقبة الممكّنة بالذكاء الاصطناعي في أنظمة المراقبة بالمطابخ التجارية، مع معالجة التحديات الفريدة: تعيين الملاحظات إلى القواعس المحددة مسبقًا وإنشاء مخرجات الكشف المنظمة.',
    inno:'يمكن لسلطات الفحص اعتماد أنظمة الذكاء الاصطناعي القابلة للتفسير التي توثق ليس فقط الانتهاكات بل أيضًا المنطق وراء الكشف، مما يخلق سجلات قابلة للتدقيق للإنفاذ.',
    tags:['القابلية للتفسير','امتثال المطبخ','تحليل الفيديو','مسار التدقيق التنظيمي'],date:'12 مايو 2026'}},
  {sec:'food',p:'p2',domains:["food", "ai-models"],
   url:'https://cybermediacreations.com/next-gen-food-safety-computer-vision-for-restaurant-inspections/',
   en:{badges:[["green", "Food Safety"], ["teal", "Inspect"]],title:'Multi-Unit Restaurant Pilot: AI Vision Models Automate Food Safety Walk-Through Inspections Without New Hardware',org:'Multi-Unit Restaurant Group · United States',
    body:'August 2026: Five-restaurant pilot tests AI vision models analyzing routine morning walk-through photos to detect violations (uncovered food, improper labeling, propped doors). AI flags violations with severity ratings; results compared against hired health-inspection consultant findings over 2 weeks. Outputs replace manual checklists with timestamped, verifiable data.',
    inno:'Inspection authorities can explore photo-based AI monitoring as an operational layer supporting regulatory inspectors—not replacing them. Vision models enable continuous internal monitoring, creating verifiable historical records for compliance audits. Authorities can partner with industry to validate accuracy across diverse facility types before regulatory adoption.',
    tags:['vision models','phone-based inspection','violation detection','operational compliance'],date:'August 15, 2026'},
   ar:{badges:[["green", "سلامة غذائية"], ["teal", "تفتيش"]],title:'تجربة عملية على عدة مطاعم: نماذج الرؤية بالذكاء الاصطناعي تؤتمت فحوصات سلامة الغذاء باستخدام الهواتف الذكية',org:'مجموعة مطاعم متعددة الوحدات · الولايات المتحدة',
    body:'أغسطس 2026: تجربة عملية على خمسة مطاعم تختبر نماذج الرؤية بالذكاء الاصطناعي لتحليل صور الفحص الروتينية الصباحية للكشف عن الانتهاكات (الطعام غير المغطى، والعلامات غير الصحيحة، والأبواب المدعومة).',
    inno:'يمكن لسلطات الفحص استكشاف المراقبة القائمة على الصور بالذكاء الاصطناعي كطبقة تشغيلية تدعم مفتشي الصحة. تمكن نماذج الرؤية المراقبة المستمرة وإنشاء سجلات تاريخية قابلة للتحقق.',
    tags:['نماذج الرؤية','الفحص القائم على الهواتف','كشف الانتهاكات','الامتثال التشغيلي'],date:'15 أغسطس 2026'}},
  {sec:'housing',p:'p1',domains:["housing", "policy"],
   url:'https://aihomebuilding.com/stories/ai-permit-precheck-toronto-honolulu-la-2026',
   en:{badges:[["blue", "Buildings"], ["teal", "Inspect"]],title:'Toronto Launches AI Permit Pre-Check for Residential Buildings; First Major Canadian City Deployment',org:'City of Toronto · Canada',
    body:'On August 27, 2026, Toronto launched Building Permit Application Pre-Check, an online AI self-check tool for eligible residential permits. The system flags missing or incomplete information, zoning issues, and Ontario Building Code violations within pilot scope. This represents Canada\'s first major municipal AI permitting deployment alongside established US programs like Honolulu\'s CivCheck and Los Angeles\'s e-check tool.',
    inno:'Inspection authorities can adopt AI pre-screening to reduce permit processing bottlenecks, allowing human reviewers to focus on complex site-specific conditions. This model demonstrates how AI flags routine compliance issues before formal review, cutting intake times and enabling inspectors to concentrate on nuanced judgment-based decisions that AI cannot handle.',
    tags:['AI pre-check','residential permits','Ontario Building Code'],date:'August 27, 2026'},
   ar:{badges:[["blue", "مباني"], ["teal", "تفتيش"]],title:'تورنتو تطلق فحص التصاريح المسبق بالذكاء الاصطناعي للمباني السكنية؛ أول نشر رئيسي للمدينة الكندية',org:'مدينة تورنتو · كندا',
    body:'في 27 أغسطس 2026، أطلقت تورنتو فحص طلب تصريح البناء المسبق، وهو أداة فحص ذاتي عبر الإنترنت بالذكاء الاصطناعي للتصاريح السكنية المؤهلة. يوضح النظام المعلومات الناقصة أو غير المكتملة، والمشاكل المتعلقة بالتقسيم المنطقي، وانتهاكات قانون البناء بأونتاريو ضمن نطاق التجربة. يمثل هذا أول نشر بلدي رئيسي لتصاريح الذكاء الاصطناعي في كندا.',
    inno:'يمكن لسلطات التفتيش اعتماد الفحص المسبق بالذكاء الاصطناعي لتقليل اختناقات معالجة التصاريح، مما يسمح لمراجعي البشر بالتركيز على الشروط المحددة للموقع. يوضح هذا النموذج كيف يوضح الذكاء الاصطناعي مشاكل الامتثال الروتينية قبل المراجعة الرسمية، مما يقلل أوقات الالتقاط ويمكّن المفتشين من التركيز على القرارات القائمة على الحكم الدقيق التي لا يستطيع الذكاء الاصطناعي التعامل معها.',
    tags:['الفحص المسبق بالذكاء الاصطناعي','التصاريح السكنية','قانون البناء بأونتاريو'],date:'27 أغسطس 2026'}},
  {sec:'housing',p:'p2',domains:["housing", "policy"],
   url:'https://stateline.org/2026/08/20/cities-turn-to-ai-to-speed-housing-permitting/',
   en:{badges:[["blue", "Buildings"], ["teal", "Inspect"]],title:'Federal HUD Grants $200M+ for AI Permitting Systems; Major US Cities Deploy CivCheck & Archistar',org:'US Department of Housing & Urban Development · USA',
    body:'In August 2026, the HUD announced up to $3M in grants for local governments to deploy automated building code systems. A new federal housing law created a $200M annual Innovation Fund. Major cities (Baltimore, Denver, Los Angeles, Seattle) launched AI tools; smaller cities (Everett WA, Lebanon NH, Naples FL) followed. Seattle\'s CivCheck pilot achieved 87% accuracy on completeness, 92% on design compliance, with 50% reduction in permit review days.',
    inno:'Inspection authorities should evaluate AI permitting tools as part of permit intake modernization. Federal funding availability makes this the optimal time to pilot code-checking systems, benchmark against peers, and establish governance protocols. These tools reduce rework cycles and intake delays, freeing inspector capacity for field inspections and violation follow-ups.',
    tags:['CivCheck','federal funding','code automation'],date:'August 20, 2026'},
   ar:{badges:[["blue", "مباني"], ["teal", "تفتيش"]],title:'منح وزارة الإسكان الفيدرالية 200 مليون دولار أو أكثر لأنظمة التصاريح بالذكاء الاصطناعي؛ تطبيق المدن الأمريكية الكبرى',org:'وزارة الإسكان والتنمية الحضرية الأمريكية · الولايات المتحدة',
    body:'في أغسطس 2026، أعلنت وزارة الإسكان عن منح تصل إلى 3 ملايين دولار للحكومات المحلية لنشر أنظمة رموز البناء الآلية. أنشأ قانون الإسكان الفيدرالي الجديد صندوق الابتكار السنوي بقيمة 200 مليون دولار. أطلقت المدن الكبرى (بالتيمور، دنفر، لوس أنجلوس، سياتل) أدوات الذكاء الاصطناعي؛ تبعتها المدن الأصغر (إيفيريت واشنطن، لبنان نيو هامبشاير، نابولي فلوريدا). حققت تجربة CivCheck في سياتل دقة بنسبة 87٪ في الاكتمال، و 92٪ في توافق التصميم، مع تقليل بنسبة 50٪ في أيام مراجعة التصاريح.',
    inno:'يجب على سلطات التفتيش تقييم أدوات التصاريح بالذكاء الاصطناعي كجزء من تحديث نموذج قبول التصاريح. توفر التمويل الفيدرالي يجعل هذا الوقت الأمثل لتجربة أنظمة فحص الأكواد، والمقارنة مع نظيراتها، وإنشاء بروتوكولات الحوكمة. تقلل هذه الأدوات دورات إعادة العمل وتأخير الالتقاط، مما يحرر القدرة على المفتشين للتفتيش الميداني ومتابعة الانتهاكات.',

  {domains:["policy"],url:'https://cryptobriefing.com/house-rsi-safety-act-ai-oversight/',
   en:{t:'RSI Safety Act Introduced: Quarterly AI Model Development Reporting',cat:'Policy',d:'November 24, 2026',s:'On November 24, 2026, Representatives Josh Gottheimer and Nathaniel Moran introduced the RSI Safety Act, requiring largest AI developers to file quarterly reports with the Office of Frontier AI Research in the Commerce Department detailing how much model development is handled by AI.'},

  {domains:["construction"],url:'https://www.prnewswire.com/news-releases/zoomlion-to-showcase-ai-powered-equipment-and-robotics-at-bauma-china-2026-302938898.html',

   ar:{t:'Zoomlion تعرض أكثر من 60 معرضاً لمعدات البناء المدفوعة بالذكاء الاصطناعي في bauma CHINA 2026',cat:'إطلاق',d:'13 نوفمبر 2026',s:'ستعرض Zoomlion المعدات والروبوتات المدفوعة بالذكاء الاصطناعي في bauma CHINA 2026 من 24 إلى 27 نوفمبر في شنغهاي. تتضمن المميزات روبوت Z01 الإنساني ثنائي الأرجل والحفارات الصغيرة بدون قاعة والمعدات المتحركة والتعدين المفتوح المحاكى مع الحفارات والشاحنات المستقلة يعرضان تقنيات الحفر الذكية.'}},
  {domains:["food"],url:'https://www.dubaiprnetwork.com/local-news/195076-dubai-municipality-launches-global-roadmap-for-the-future-of-food-safety-and-unv',

  {domains:["security"],url:'https://gbhackers.com/microsofts-ai-agent-framework-package-compromised-on-pypi/',

  {domains:["security"],url:'https://gbhackers.com/cyberstrikeai-security-risks/',

  {domains:["security"],url:'https://memeburn.com/fully-automated-ai-cyberattack/',
   en:{t:'Google Discovers First Fully Automated AI Cyberattack with Autonomous Exploitation',cat:'Security',d:'November 16, 2026',s:'On November 16, 2026, Google documented autonomous AI frameworks including CAIRN and PentAGI automating reconnaissance, vulnerability testing, and exploitation. An \'exploit_agent\' AI tool discovered on a staging server identified flaws, built exploits, and attacked websites without human involvement.'},

  {domains:["funding"],url:'https://cbsnews.com/news/anthropic-ipo-ai-boom-nasdaq-debut',

   ar:{t:'الاكتتاب العام الأولي لـ Anthropic معروض للإطلاق يوم الخميس كاختبار ذكاء اصطناعي رئيسي',cat:'تمويل',d:'17 نوفمبر 2026',s:'معروض الاكتتاب العام الأولي الضخم لـ Anthropic للإطلاق في 20 نوفمبر 2026 مع 825 مليون سهم بسعر 70-78 دولار، متوقع جمع 64.3 مليار دولار. ستقدم الشركة 26 مليار دولار إضافية من عرض الطرح الخاص من AMD وBroadcom وGoogle وMicrosoft وNvidia. يُتوقع أن يقيّم الظهور الأول Anthropic بما يصل إلى 1.4 تريليون دولار.'}},
  {domains:["funding"],url:'https://www.cnbc.com/2026/10/22/openai-funding-round-uae-investors.html',
   en:{t:'OpenAI Nears $30 Billion Funding Round at $1.25 Trillion Valuation',cat:'Funding',d:'October 22, 2026',s:'OpenAI is finalizing a $30 billion funding round at $1.25 trillion pre-money valuation, led by UAE investors and Coatue, as a bridge to its 2027 IPO. This positions OpenAI ahead of competitors while Anthropic pursues its November 2026 IPO.'},

  {domains:["smart-city", "research"],url:'https://x.com/TECO_Toronto/status/2122440397704282507',

  {domains:["smart-city", "research"],url:'https://www.techtarget.com/news/2027-ai-outlook-cheaper-tokens-steeper-ai-bills/874786/',

  {domains:["smart-city"],url:'https://en.antaranews.com/news/443031/together-for-an-ai-powered-urban-future-dahua-technology-showcases-practical-aiot-solutions-at-scewc-2026',

  {domains:["smart-city"],url:'https://dronelife.com/2026/10/27/percepto-launches-hardware-agnostic-axion-platform-for-infrastructure-inspection-data',

   ar:{t:'Percepto تطلق منصة Axion للذكاء الاصطناعي غير المرتبطة بالأجهزة لفحص البنية التحتية',cat:'إطلاق',d:'27 أكتوبر 2026',s:'أطلقت Percepto منصة Axion في 27 أكتوبر 2026، وهي منصة ذكاء اصطناعي فيزيائي تطبق أكثر من 160 نموذج ذكاء اصطناعي على بيانات الفحص من الطائرات بدون طيار والمستشعرات والأرشيفات من جهات خارجية. تم تدريبها على أكثر من 100,000 ساعة من بيانات الفحص المستقلة. يمكن للمشغلين تنظيم بيانات الفحص حسب الأصل، وطرح أسئلة باللغة الطبيعية حول النتائج، وإضافة أنظمة مستقلة لزيادة التغطية.'}},
  {domains:["construction"],url:'https://www.globenewswire.com/news-release/2026/11/17/3404978/28124/en/construction-drones-global-market-share-trends-growth-and-forecast-2026-2031-market-to-reach-usd-14-09-billion-as-ai-bim-and-automation-drive-11-81-cagr.html',

   ar:{t:'سوق طائرات البناء بدون طيار سيصل إلى 14.09 مليار دولار بحلول 2031 مع نمو الذكاء الاصطناعي و BIM',cat:'بحث',d:'17 نوفمبر 2026',s:'يتوقع أن يتوسع السوق العالمي لطائرات البناء بدون طيار بمعدل نمو سنوي مركب قدره 11.81٪ حتى 2031، مدفوعاً بالتحليلات المدعومة بالذكاء الاصطناعي وتكامل BIM ومزامنة التوأم الرقمي. تمكن السحب النقطية التي تولدها الطائرات بدون طيار المقارنة بين ظروف الموقع المخطط والفعلي.'}},
  {domains:["policy"],url:'https://washingtonpost.com/technology/2026/11/16/trump-officials-issue-rule-restrict-sales-ai-chips-china',
   en:{t:'US Commerce Department Closes Remote Access Loophole for Advanced AI Chips',cat:'Policy',d:'November 16, 2026',s:'On November 16, 2026, the Trump administration implemented new regulations restricting Chinese entities from remotely accessing advanced AI chips and servers via third-country data centers, closing a loophole in export controls. The rule requires export licenses for data centers in Singapore, Malaysia, Indonesia, Thailand, and Brazil providing remote access to restricted AI chips to embargoed countries.'},
   ar:{t:'وزارة التجارة الأمريكية تغلق ثغرة الوصول البعيد لرقائق الذكاء الاصطناعي المتقدمة',cat:'سياسة',d:'16 نوفمبر 2026',s:'في 16 نوفمبر 2026، طبقت إدارة ترامب لوائح جديدة تقيد الكيانات الصينية من الوصول عن بعد إلى رقائق وخوادم الذكاء الاصطناعي المتقدمة عبر مراكز البيانات في الدول الثالثة، مما يغلق ثغرة في ضوابط التصدير. تتطلب القاعدة تراخيص تصدير لمراكز البيانات في سنغافورة وماليزيا وإندونيسيا وتايلاند والبرازيل التي توفر وصولاً بعيداً إلى رقائق الذكاء الاصطناعي المقيدة للدول الخاضعة للحظر.'}},
  {domains:["policy"],url:'https://www.insurancejournal.com/news/national/2026/11/16/892718.htm',
   en:{t:'White House Urges Easing AI Company Liability to Encourage Incident Disclosure',cat:'Policy',d:'November 16, 2026',s:'On November 16, 2026, President Trump\'s artificial intelligence task force recommended that federal agencies ease their cyber liability policies for 12 months or longer to incentivize AI companies to report critical incidents. The move represents a shift from earlier threats of legal action toward offering developers liability relief in exchange for voluntary safety compliance.'},
   ar:{t:'البيت الأبيض يحث على تخفيف المسؤولية القانونية لشركات الذكاء الاصطناعي لتشجيع الإبلاغ عن الحوادث',cat:'سياسة',d:'16 نوفمبر 2026',s:'في 16 نوفمبر 2026، أوصت فرقة عمل الذكاء الاصطناعي التابعة للرئيس ترامب الوكالات الفيدرالية بتخفيف سياسات المسؤولية الإلكترونية الخاصة بها لمدة 12 شهراً أو أطول لحفز شركات الذكاء الاصطناعي على الإبلاغ عن الحوادث الحرجة. يمثل هذا التحرك تحولاً من التهديدات السابقة بالإجراءات القانونية نحو تقديم إعفاء من المسؤولية للمطورين مقابل الامتثال الطوعي للسلامة.'}},
  {domains:["funding"],url:'https://www.cnbc.com/2026/11/17/anthropic-ipo-ai-venture-capital.html',
   en:{t:'Anthropic IPO: For hundreds of billions flowing into AI startups, big debut is a must',cat:'Funding',d:'November 17, 2026',s:'Anthropic CEO Dario Amodei pitched firm\'s IPO at JPMorgan seeking to raise $64.4 billion in IPO plus $26 billion in private placement. AI captured 86% of U.S. venture capital dollars in first half 2026, with over $350 billion invested in AI startups.'},
   ar:{t:'اكتتاب Anthropic: مع مئات المليارات التي تتدفق إلى شركات الذكاء الاصطناعي، الظهور الكبير ضروري',cat:'تمويل',d:'17 نوفمبر 2026',s:'قدم الرئيس التنفيذي لـ Anthropic داريو أموديي عرض الاكتتاب العام الأولي للشركة في JPMorgan بهدف جمع 64.4 مليار دولار في الاكتتاب العام الأولي بالإضافة إلى 26 مليار دولار في الاستثمار الخاص. استحوذ الذكاء الاصطناعي على 86٪ من دولارات رأس المال الاستثماري الأمريكي في النصف الأول من عام 2026، مع استثمار أكثر من 350 مليار دولار في شركات الذكاء الاصطناعي.'}},
  {domains:["funding"],url:'https://www.newsbytesapp.com/news/business/anthropic-aims-14-trillion-valuation-in-ipo-amid-ai-boom/tldr',

   ar:{t:'Anthropic تستهدف تقييماً بـ 1.4 تريليون دولار في الاكتتاب العام الأولي وسط ازدهار الذكاء الاصطناعي',cat:'تمويل',d:'17 نوفمبر 2026',s:'تستهدف Anthropic تقييماً بـ 1.4 تريليون دولار في الاكتتاب العام الأولي القادم مع دعم المستثمرين الرئيسيين بما في ذلك Altimeter Capital (5 مليار دولار) و NVIDIA و Google و Microsoft. تدفقت 86٪ من دولارات الذكاء الاصطناعي الأمريكية إلى الذكاء الاصطناعي في النصف الأول من عام 2026.'}},
  {domains:["smart-city", "research"],url:'https://www.forbes.com/sites/anishasircar/2026/11/12/ai-futures-project-pulls-its-intelligence-explosion-forecast-into-2027/',

   ar:{t:'الذكاء الاصطناعي يساعد المدن على التنبؤ بمشاكل البنية التحتية قبل تفاقمها',cat:'اختراق',d:'4 نوفمبر 2026',s:'تحلل رؤية حاسوبية مدعومة بالذكاء الاصطناعي الصور من كاميرات المركبات لتحديد عيوب الطرق ومشاكل البنية التحتية. ضم ورشة عمل AI CityXchange في دبلن (نوفمبر 2026) حوالي 80 من قادة التكنولوجيا الحكومية يستكشفون تطبيقات عملية لإدارة المدن بالذكاء الاصطناعي. مع التركيز على كشف أضرار الطرق ومراقبة الأشجار المريضة وإحياء العقارات الشاغرة لتحسين صيانة البنية التحتية البلدية وتخصيص الموارد.'}},
  {domains:["smart-city"],url:'https://www.progressiverobot.com/2026/11/03/agentic-ai-nvidia-cities-worldwide/',

  {domains:["smart-city"],url:'https://rentalhousingjournal.com/ai-driven-photography-creates-next-level-inspection-detection',

  {domains:["policy"],url:'https://www.semafor.com/article/11/03/2026/openai-pushes-policy-rebrand-to-a-skeptical-audience',

   ar:{t:'OpenAI تدفع بإعادة تسمية سياسة الذكاء الاصطناعي بعد الانتخابات النصفية رغم الشكوك البرلمانية',cat:'سياسة',d:'3 نوفمبر 2026',s:'أطلقت OpenAI إعادة تسمية سياسة في 3 نوفمبر 2026، مقارنة قوانين الذكاء الاصطناعي بحدود السرعة للسيارات والدعوة إلى معايير ذكاء اصطناعي عالمية. أشار الرئيس التنفيذي Chris Lehane إلى خطط للدفع بتشريع اختبار الذكاء الاصطناعي الإلزامي بدعم ثنائي الحزب مع تأييد فواتير سلامة الذكاء الاصطناعي الحدية المختارة في كاليفورنيا، حيث تترك إلغاء التنظيم الفيدرالي مئات من الفواتير الحكومية قيد المعالجة.'}},

const FILL_COLORS=['var(--green)','#6ab04c','var(--amber)','#e07020','var(--red)'];
const FILL_WIDTHS=[20,40,60,80,100];

// Date parsing — fully dynamic, year-agnostic, works in 2026, 2027, 2028+
function parseDateNum(d){
  if(!d) return 0;
  const s=d.toLowerCase().replace(/ auto$/,'').replace(/ تلقائي$/,'').trim();

  // Helper: convert a JS Date to sortable YYYYMMDD integer
  const toN = dt => dt.getFullYear()*10000 + (dt.getMonth()+1)*100 + dt.getDate();
  const now  = new Date();
  const ago  = n => { const x=new Date(now); x.setDate(x.getDate()-n); return toN(x); };
  const wAgo = n => ago(n*7);
  const mAgo = n => { const x=new Date(now); x.setMonth(x.getMonth()-n); return toN(x); };

  // ── Full named-date: "May 31, 2026" / "31 May 2026" / "June 1, 2027" ──
  const EN_MONTHS = {january:1,february:2,march:3,april:4,may:5,june:6,
                     july:7,august:8,september:9,october:10,november:11,december:12};
  // "Month DD, YYYY" or "Month DD YYYY"
  const m1 = s.match(/([a-z]+)\s+(\d{1,2}),?\s+(\d{4})/);
  if(m1 && EN_MONTHS[m1[1]]) return parseInt(m1[3])*10000 + EN_MONTHS[m1[1]]*100 + parseInt(m1[2]);
  // "DD Month YYYY"
  const m2 = s.match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
  if(m2 && EN_MONTHS[m2[2]]) return parseInt(m2[3])*10000 + EN_MONTHS[m2[2]]*100 + parseInt(m2[1]);

  // ── Arabic full date: "31 مايو 2026" ──
  const AR = {يناير:1,فبراير:2,مارس:3,أبريل:4,مايو:5,يونيو:6,
              يوليو:7,أغسطس:8,سبتمبر:9,أكتوبر:10,نوفمبر:11,ديسمبر:12};
  for(const [ar,mn] of Object.entries(AR)){
    if(s.includes(ar)){
      const dy = s.match(/(\d{1,2})/);
      const yr = s.match(/(\d{4})/);
      if(dy && yr) return parseInt(yr[1])*10000 + mn*100 + parseInt(dy[1]);
      if(yr)       return parseInt(yr[1])*10000 + mn*100;
    }
  }

  // ── Partial named month (no year given — assume current or previous year) ──
  const thisYear = now.getFullYear();
  const thisMonth = now.getMonth()+1;
  const EN_ABBR = {jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  // "Apr 17" or "apr 17, 2026 new" style (already caught above if year present)
  for(const [abbr,mn] of Object.entries(EN_ABBR)){
    if(s.startsWith(abbr)||s.includes(' '+abbr)){
      const dy = s.match(/(\d{1,2})/);
      const yr = mn <= thisMonth ? thisYear : thisYear - 1; // don't jump to future
      return yr*10000 + mn*100 + (dy ? parseInt(dy[1]) : 15);
    }
  }
  // May is both a month and a word — handle carefully
  if((s.startsWith('may ')||s.includes(' may ')||s==='may')&&!s.match(/\d{4}/)){
    const dy=s.match(/(\d{1,2})/);
    const yr=5<=thisMonth?thisYear:thisYear-1;
    return yr*10000+5*100+(dy?parseInt(dy[1]):15);
  }

  // ── Relative dates — computed from today ──
  if(s.includes('today')||s.includes('اليوم')||s.includes('now')) return toN(now);
  const dayN = s.match(/(\d+)\s*day/);   if(dayN) return ago(parseInt(dayN[1]));
  const wkN  = s.match(/(\d+)\s*week/);  if(wkN)  return wAgo(parseInt(wkN[1]));
  const moN  = s.match(/(\d+)\s*month/); if(moN)  return mAgo(parseInt(moN[1]));
  // Arabic relative
  if(s.includes('يومان'))                return ago(2);
  if(s.match(/(\d+)\s*أيام/))           return ago(parseInt(s.match(/(\d+)/)[1]));
  if(s.match(/(\d+)\s*أسابيع/))         return wAgo(parseInt(s.match(/(\d+)/)[1]));
  if(s.includes('أسبوع'))               return wAgo(1);
  if(s.includes('شهر'))                 return mAgo(1);
  if(s.match(/(\d+)\s*شهر/))            return mAgo(parseInt(s.match(/(\d+)/)[1]));
  if(s.includes('week ago')||s.includes('week')) return wAgo(1);
  if(s.includes('month'))               return mAgo(1);

  // ── Year-only or range ──
  const yrOnly = s.match(/\b(20\d\d)\b/);
  if(yrOnly) return parseInt(yrOnly[1])*10000 + 101; // Jan 1 of that year

  // ── Fallbacks ──
  if(s.includes('ongoing')||s.includes('مستمر')) return toN(now)-365;
  if(s.includes('ready')||s.includes('جاهز'))   return toN(now);
  return 0;
}

function sortCards(cards){
  if(SORT_MODE==='date'){
    return [...cards].sort((a,b)=>{
      const da=parseDateNum((a[LANG]||a.en)?.date||'');
      const db=parseDateNum((b[LANG]||b.en)?.date||'');
      return db-da;
    });
  }
  return cards; // 'priority' = original order
}

    <div class="card-title">${d.title}</div>
    <div class="card-org">${d.org}</div>
    <div class="card-body">${d.body}</div>
    <div class="inno"><div class="inno-lbl">${l.yourAction}</div><div class="inno-txt">${d.inno}</div><div class="tags">${tags}</div></div>

    </div>
    <div class="cft"><span class="cft-date">${d.date}</span></div>

}

function buildAISignal(s,lang){
  const d=s[lang];
  if(!d) return '';
  if(ACTIVE_DOMAIN!=='all' && !(s.domains||[]).includes(ACTIVE_DOMAIN)) return '';
  const catMap={Release:'bdg-green',Breakthrough:'bdg-blue',Policy:'bdg-amber',Security:'bdg-red',Funding:'bdg-teal',Research:'bdg-gray',
    'إطلاق':'bdg-green','اختراق':'bdg-blue','سياسة':'bdg-amber','أمن':'bdg-red','تمويل':'bdg-teal','بحث':'bdg-gray'};
  const domTags=(s.domains||[]).map(id=>`<span class="dtag ${id===ACTIVE_DOMAIN?'active-domain':''}" onclick="setDomain('${id}')">${domainName(id,lang)}</span>`).join('');
  const lnk=sourceLink(s.url,L[lang].refLabel);
  return`<div class="card">
    <div class="card-top"><div></div><div class="badges"><span class="bdg ${catMap[d.cat]||'bdg-gray'}">${d.cat}</span></div></div>
    <div class="card-domains">${domTags}</div>
    <div class="card-title">${d.t}</div>
    <div class="card-body" style="margin-top:3px">${d.s}</div>
    <div class="cft"><span class="cft-date">${d.d}</span>${lnk}</div>
  </div>`;
}

function sectionBlock(key,lang,cards){
  const l=L[lang];
  const filtered=sortCards(cards.filter(c=>c.sec===key && domainMatch(c)));
  if(!filtered.length) return '';
  const [icon,title,sub]=l.secTitles[key];
  const bgs={city:'var(--teal-lt)',construction:'var(--amber-lt)',food:'var(--green-lt)',housing:'var(--blue-lt)'};
  return`<div class="sec-hd"><div class="sec-icon" style="background:${bgs[key]||'var(--paper3)'}">${icon}</div><div><div class="sec-title">${title}</div><div class="sec-sub">${sub}</div></div></div>
    <div class="grid">${filtered.map(c=>buildCard(c,lang)).join('')}</div><div class="sec-div"></div>`;
}

function buildStats(ns,ls){
  return`<div class="stats">${ns.map((n,i)=>`<div class="stat"><div class="stat-n">${n}</div><div class="stat-l">${ls[i]}</div></div>`).join('')}</div>`;
}

function buildLegend(lang){
  const l=L[lang];
  const items=l.legendItems.map((lb,i)=>`<span style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink2)"><span style="display:inline-block;width:22px;height:5px;border-radius:2px;background:${FILL_COLORS[i]}"></span>${lb}</span>`).join('');
  const vts=Object.entries(l.verdicts).map(([k,v])=>`<span class="verdict ${{go:'v-go',pilot:'v-pilot',plan:'v-plan',long:'v-long'}[k]}" style="font-size:8px">${v}</span>`).join('');
  return`<div class="lgd" style="gap:10px;font-size:10px"><span style="color:var(--ink3);font-weight:600">${l.legendLabel}</span>${items}<span style="margin-inline-start:auto;display:flex;gap:4px;flex-wrap:wrap">${vts}</span></div>`;
}

function buildDecisionTable(lang){
  const l=L[lang];
  const dots=n=>'●'.repeat(n)+'○'.repeat(5-n);
  const vCls={go:'v-go',pilot:'v-pilot',plan:'v-plan',long:'v-long'};
  const rows=DT_ROWS.map(r=>{
    const nm=lang==='en'?r.en:r.ar;
    const dc=r.dims.map((n,i)=>`<td><span style="color:${FILL_COLORS[n-1]};font-weight:700">${dots(n)}</span></td>`).join('');
    return`<tr><td>${nm}</td>${dc}<td><span class="verdict ${vCls[r.verdict]}" style="font-size:8px">${l.verdicts[r.verdict]}</span></td></tr>`;
  }).join('');
  const ths=l.dtHeaders.map(h=>`<th>${h}</th>`).join('');
  return`<div class="sec-hd"><div class="sec-icon" style="background:var(--paper3)">📊</div><div><div class="sec-title">${l.decisionTitle}</div><div class="sec-sub">${l.decisionSub}</div></div></div>
    <div style="overflow-x:auto"><table class="dtable"><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>
    <div style="margin-top:7px;padding:7px 11px;background:var(--paper2);border-radius:7px;border:.5px solid var(--line);font-size:9px;color:var(--ink3)">${l.dtNote}</div>`;
}

function buildSidebar(lang){
  const l=L[lang];
  const bc={teal:'teal-lt',amber:'amber-lt',blue:'blue-lt',green:'green-lt',purple:'purple-lt',gray:'paper3'};
  const tc={teal:'teal',amber:'amber',blue:'blue',green:'green',purple:'purple',gray:'ink3'};

  // ── AUTO-POPULATE from live INSPECT cards (newest 8) ──────────────
  const domainColor = {
    'smart-city':'teal','construction':'amber','food':'green',
    'housing':'blue','policy':'purple','security':'red'
  };
  const livePris = [...INSPECT]
    .sort((a,b) => parseDateNum((b[lang]||b.en)?.date||'') - parseDateNum((a[lang]||a.en)?.date||''))
    .slice(0, 8)
    .map(c => {
      const d = c[lang] || c.en;
      const domClr = domainColor[c.domains?.[0]] || 'gray';
      const dateStr = d?.date || '';
      const titleStr = d?.title || '';
      // Truncate title to ~55 chars
      const shortTitle = titleStr.length > 55 ? titleStr.slice(0,55)+'…' : titleStr;
      const srcLink = c.url ? `<a href="${c.url}" target="_blank" rel="noopener" class="sb-src-link">↗ ${(()=>{try{return new URL(c.url).hostname.replace(/^www\./,'')}catch(e){return 'src'}})()}</a>` : '';
      return `<div class="mini"><div class="mini-t">${shortTitle}</div><div class="mini-m"><span class="mini-bdg" style="background:var(--${bc[domClr]||'paper3'});color:var(--${tc[domClr]||'ink3'})">${dateStr}</span>${srcLink}</div></div>`;
    }).join('');

  // ── AUTO-POPULATE Breaking from live AI_SIGNALS (newest 5) ──────────
  const catClr={'Release':'teal','Breakthrough':'teal','Policy':'amber','Security':'red','Funding':'green','Research':'gray',
    'إطلاق':'teal','اختراق':'teal','سياسة':'amber','أمن':'red','تمويل':'green','بحث':'gray'};
  const brk=[...AI_SIGNALS]
    .sort((a,b)=>parseDateNum((b[lang]||b.en)?.d||'')-parseDateNum((a[lang]||a.en)?.d||''))
    .slice(0,5)
    .map(s=>{
      const d=s[lang]||s.en;
      const clr=catClr[d?.cat]||'gray';
      const title=(d?.t||'').slice(0,55)+((d?.t||'').length>55?'…':'');
      const srcLink2 = s.url ? `<a href="${s.url}" target="_blank" rel="noopener" class="sb-src-link">↗ ${(()=>{try{return new URL(s.url).hostname.replace(/^www\./,'')}catch(e){return 'src'}})()}</a>` : '';
      return `<div class="mini"><div class="mini-t">${title}</div><div class="mini-m"><span class="mini-bdg" style="background:var(--${bc[clr]||'paper3'});color:var(--${tc[clr]||'ink3'})">${d?.d||''}</span>${srcLink2}</div></div>`;
    }).join('');

  const rc={teal:'var(--teal)',amber:'var(--amber)',blue:'var(--blue)',ink3:'var(--ink3)'};
  const reviewedLabel = lang==='ar'
    ? `آخر مراجعة: ${computeNewestDate(lang)}`
    : `Last reviewed: ${computeNewestDate(lang)}`;
  const rm = l.sbRoadmap.map(r =>
    `<div class="rm-item" style="border-color:${rc[r.c]||'var(--paper3)'}"><h4 style="color:${rc[r.c]||'var(--ink3)'}">${r.h}</h4><p>${r.p}</p></div>`
  ).join('') + `<div style="font-size:9px;font-family:'DM Mono',monospace;color:var(--ink4);margin-top:6px">${reviewedLabel}</div>`;

  return `<div class="sb-sec"><div class="sb-title">${l.sbPriTitle}</div>${livePris}</div>` +
         `<div class="sb-sec"><div class="sb-title">${l.sbBreakTitle}</div>${brk}</div>` +
         `<div class="sb-sec"><div class="sb-title">${l.sbRoadTitle}</div>${rm}</div>`;
}

// COUNT signals per domain for filter bar
// ════════════════════════════════════════════════════════════════
function countForDomain(domId,tabId){
  if(domId==='all') return null; // shows total
  let total=0;
  if(tabId==='inspect'){
    total+=INSPECT.filter(c=>(c.domains||[]).includes(domId)).length;
  } else if(tabId==='apply'){
    total+=VECTORS.filter(v=>(v.domains||[]).includes(domId)).length;
  } else if(tabId==='ai'){
    total+=AI_SIGNALS.filter(s=>(s.domains||[]).includes(domId)).length;
  }
  return total;
}

function renderNav(lang){
  const l=L[lang];
  // Live counts — always reflect actual array sizes, not hardcoded L values
  const liveCounts={inspect:INSPECT.length, apply:VECTORS.length, ai:AI_SIGNALS.length};
  return l.tabs.map(t=>`<button class="nav-tab ${t.id===ACTIVE_TAB?'active':''}" onclick="switchTab('${t.id}')">${t.label}<span class="cnt">${liveCounts[t.id]??t.count}</span></button>`).join('');
}

function renderDomainBar(lang){
  const l=L[lang];
  const btns=DOMAINS.map(d=>{
    const cnt=countForDomain(d.id,ACTIVE_TAB);
    const badge=cnt!==null?`<span class="df-count">${cnt}</span>`:'';
    const label=lang==='ar'?d.ar:d.en;
    return`<button class="dfbtn ${ACTIVE_DOMAIN===d.id?'active':''}" onclick="setDomain('${d.id}')">${d.emoji} ${label}${badge}</button>`;
  }).join('');
  const sortLabel=lang==='ar'?'ترتيب:':'Sort:';
  const byDateLabel=lang==='ar'?'📅 حسب التاريخ':'📅 Date';
  const byPriLabel=lang==='ar'?'⭐ حسب الأهمية':'⭐ Priority';
  const sortBtns=`<span style="margin-inline-start:auto;display:flex;gap:4px;align-items:center;flex-shrink:0">
    <span class="dfbar-label">${sortLabel}</span>
    <button class="dfbtn ${SORT_MODE==='date'?'active':''}" onclick="setSort('date')">${byDateLabel}</button>
    <button class="dfbtn ${SORT_MODE==='priority'?'active':''}" onclick="setSort('priority')">${byPriLabel}</button>
  </span>`;
  return`<span class="dfbar-label">${l.dfLabel}</span>${btns}${sortBtns}`;
}

function renderTab(tabId,lang){
  const l=L[lang];
  const noRes=`<div class="empty-state"><span>🔍</span>${l.noResults}</div>`;

  if(tabId==='inspect'){
    const secs=['city','construction','food','housing'];
    // Override count with live INSPECT.length; other stats remain editorial
    const liveStats=[String(INSPECT.length),...l.stats_inspect.slice(1)];
    const html=buildStats(liveStats,l.stats_inspect_l)+secs.map(s=>sectionBlock(s,lang,INSPECT)).join('');
    const hasContent=secs.some(s=>INSPECT.filter(c=>c.sec===s&&domainMatch(c)).length>0);
    return html+(hasContent?'':noRes);
  }
  if(tabId==='apply'){
    const [icon,title,sub]=l.secTitles.vectors;
    const cards=VECTORS.map(v=>buildVectorCard(v,lang)).filter(Boolean).join('');
    const hasContent=VECTORS.some(v=>ACTIVE_DOMAIN==='all'||(v.domains||[]).includes(ACTIVE_DOMAIN));
    return buildStats(l.stats_apply,l.stats_apply_l)+buildLegend(lang)+
      `<div class="sec-hd"><div class="sec-icon" style="background:var(--teal-lt)">${icon}</div><div><div class="sec-title">${title}</div><div class="sec-sub">${sub}</div></div></div>`+
      `<div class="grid">${cards}</div><div class="sec-div"></div>`+buildDecisionTable(lang);
  }
  if(tabId==='ai'){
    const [icon,title,sub]=l.secTitles.global;
    const sorted=SORT_MODE==='date'
      ? [...AI_SIGNALS.filter(s=>domainMatch(s))].sort((a,b)=>parseDateNum((b[LANG]||b.en)?.d||'')-parseDateNum((a[LANG]||a.en)?.d||''))
      : AI_SIGNALS.filter(s=>domainMatch(s));
    const cards=sorted.map(s=>buildAISignal(s,lang)).filter(Boolean).join('');
    const hasContent=AI_SIGNALS.some(s=>domainMatch(s));
    const liveSub=lang==='ar'?`${AI_SIGNALS.length} إشارة — نماذج حدودية، بنية تحتية، جيوسياسة`:`${AI_SIGNALS.length} signals — frontier models, infrastructure, geopolitics`;
    return`<div class="sec-hd"><div class="sec-icon" style="background:var(--paper3)">${icon}</div><div><div class="sec-title">${title}</div><div class="sec-sub">${liveSub}</div></div></div>`+
      `<div class="grid">${cards}</div>`+(hasContent?'':noRes);
  }
  return '';
}

// Compute the date of the newest signal across all data
function computeNewestDate(lang){
  let maxNum=0;
  [...INSPECT,...AI_SIGNALS].forEach(s=>{
    const d=s[lang]||s.en;
    const n=parseDateNum(d?.date||d?.d||'');
    if(n>maxNum) maxNum=n;
  });
  if(!maxNum) return lang==='ar'?'غير معروف':'Unknown';
  const yr=Math.floor(maxNum/10000);
  const mo=Math.floor((maxNum%10000)/100);
  const dy=maxNum%100;
  if(lang==='ar'){
    const m=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return `${dy} ${m[mo]} ${yr}`;
  }
  const m=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${m[mo]} ${dy}, ${yr}`;
}

// Total live signal count
function totalSignals(){ return INSPECT.length + AI_SIGNALS.length; }

function render(lang){
  const l=L[lang];
  const root=document.getElementById('root');
  root.setAttribute('lang',lang);
  root.setAttribute('dir',lang==='ar'?'rtl':'ltr');
  document.getElementById('wm').innerHTML=lang==='ar'?`${l.wm[0]}<span>${l.wm[1]}</span>`:`${l.wm[0]}<span>${l.wm[1]}</span>`;
  document.getElementById('tl').textContent=l.tl;
  // Dynamic — always reflect actual newest signal date and live count
  // Header date = today's actual date from browser clock
  const todayDate=(()=>{const n=new Date();if(lang==='ar'){const m=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];return n.getDate()+' '+m[n.getMonth()+1]+' '+n.getFullYear();}return n.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});})();
  document.getElementById('scan-date').textContent=todayDate;
  document.getElementById('sig-count').textContent=totalSignals()+(lang==='ar'?' إشارة':' signals');
  document.getElementById('nav-tabs').innerHTML=renderNav(lang);
  // Seed banner — visible only until radar_rescan.py has run once
  let sb=document.getElementById('seed-banner');
  if(SEED_PENDING){
    if(!sb){sb=document.createElement('div');sb.id='seed-banner';document.querySelector('.nav').insertAdjacentElement('beforebegin',sb);}
    sb.style.cssText='margin:8px 20px 0;padding:8px 12px;border-radius:7px;background:var(--amber-lt);color:var(--amber);font-size:11px;font-family:\'DM Mono\',monospace';
    sb.textContent=lang==='ar'
      ?'⚠️ محتوى أولي — سيتم استبدال بطاقات التفتيش وإشارات السوق بالكامل عند أول تشغيل لـ radar_rescan.py'
      :'⚠️ Seed content — INSPECT cards and Market Intel are replaced in full on the first radar_rescan.py run';
  } else if(sb){ sb.remove(); }
  document.getElementById('domain-filter-bar').innerHTML=renderDomainBar(lang);
  document.getElementById('main-content').innerHTML=renderTab(ACTIVE_TAB,lang);
  document.getElementById('sidebar-content').innerHTML=buildSidebar(lang);
}

function setSort(mode){

}

function setLang(l){

function buildInvPanel(lang){
  const d=INV[lang];
  const sl=SIG_LABELS;
  const newestDate=computeNewestDate(lang);

  // Staleness check — warn if investment data is >14 days older than newest signal
  // ══ INV-DATA-DATE ══
  const invDataDate=20261127;
  // ══ /INV-DATA-DATE ══
  const newestNum=computeNewestDate('en'); // get the raw number via a helper
  const isStale=parseDateNum(computeNewestDate('en'))>invDataDate+14;

  const invAsOf=(()=>{const y=Math.floor(invDataDate/10000),mo=Math.floor((invDataDate%10000)/100),dy=invDataDate%100;
    if(lang==='ar'){const m=['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];return `${dy} ${m[mo]} ${y}`;}
    const m=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${m[mo]} ${dy}, ${y}`;})();
  const timestampLabel=lang==='ar'
    ?`📅 بيانات الاستثمار من: ${invAsOf} · أحدث الإشارات: ${newestDate}`
    :`📅 Investment data as of: ${invAsOf} · Newest signals: ${newestDate}`;
  const staleWarning=isStale
    ?(lang==='ar'
      ?'⚠️ بيانات الاستثمار قد تكون قديمة — يُنصح بمراجعة يدوية'
      :'⚠️ Investment ratings may be stale — manual review recommended')
    :'';

  const timestampHtml=`<div style="margin-bottom:14px;padding:9px 12px;background:var(--paper2);border-radius:7px;border:.5px solid var(--line)">
    <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--ink3)">${timestampLabel}</div>
    ${staleWarning?`<div style="margin-top:5px;font-size:10px;font-family:'DM Mono',monospace;color:var(--amber)">${staleWarning}</div>`:''}
  </div>`;

  const stocks=d.stocks.map(s=>`<div class="stock-row">
    <div class="stock-ticker">${s.ticker}</div>
    <div class="stock-name">${s.name}</div>
    <div class="stock-signal sig-${s.signal}">${sl[s.signal][lang]}</div>
    <div class="stock-why">${s.why}</div>
  </div>`).join('');
  const opps=d.opps.map(o=>`<div class="opp-card">
    <div class="opp-top"><div class="opp-title">${o.title}</div><span class="opp-horizon">${o.horizon}</span></div>
    <div class="opp-body">${o.body}</div>
    <div class="opp-tickers">${o.tickers.map(t=>`<span class="opp-ticker">${t}</span>`).join('')}</div>
  </div>`).join('');
  const risks=d.risks.map(r=>`<div class="risk-row">
    <div class="risk-icon">${r.icon}</div>
    <div class="risk-text"><strong>${r.title}</strong>${r.body}</div>
  </div>`).join('');
  return timestampHtml+
    `<div class="inv-block"><div class="inv-sec-title">${d.stocksTitle}</div>${stocks}</div>
    <div class="inv-block"><div class="inv-sec-title">${d.oppsTitle}</div>${opps}</div>
    <div class="inv-block"><div class="inv-sec-title">${d.risksTitle}</div>${risks}</div>`;
}

}
